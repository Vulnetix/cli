apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent
spec:
  template:
    spec:
      initContainers:
        - name: setup
          image: busybox:1.36
          securityContext:
~>            privileged: true
      containers:
        - name: agent
          image: ghcr.io/example/agent:1.0
          securityContext: { runAsUser: 0, allowPrivilegeEscalation: true }
