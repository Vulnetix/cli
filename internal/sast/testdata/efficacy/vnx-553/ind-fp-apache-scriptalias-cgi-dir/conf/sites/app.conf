<VirtualHost *:80>
    ServerName app.example.internal
    DocumentRoot /var/www/app/public
    ScriptAlias /cgi-bin/ "/var/www/app/cgi-bin/"
    # ScriptAlias /bin/ "/bin/" was removed in 2019
    <Directory "/var/www/app/cgi-bin">
        Options +ExecCGI
        Require all granted
    </Directory>
</VirtualHost>
