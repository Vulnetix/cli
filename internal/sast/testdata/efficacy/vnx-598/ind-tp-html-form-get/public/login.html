<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Staff sign-in</title>
</head>
<body>
~>  <form action="/session" method="GET" class="login">
    <label for="user">Username</label>
    <input id="user" type="text" name="user" autocomplete="username">
    <label for="pw">Password</label>
    <input id="pw" type="password" name="pw" autocomplete="current-password">
    <button type="submit">Sign in</button>
  </form>
</body>
</html>
