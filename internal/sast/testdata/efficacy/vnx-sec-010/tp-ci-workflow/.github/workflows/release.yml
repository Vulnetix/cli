name: release
on:
  push:
    tags: ["v*"]
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          registry-url: https://registry.npmjs.org
      - run: npm publish --access public
        env:
~>          NODE_AUTH_TOKEN: "@@sample:npm_[A-Za-z0-9]{36}@@"
