apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-db
type: Opaque
data:
  db-password: {{ .Values.db.password | b64enc }}
stringData:
  api-token: ${API_TOKEN}
  other-secret: $(OTHER_SECRET)
  client-secret: <client-secret>
  empty-password: ""
  default-password: changeme
  enc-password: ENC[AES256_GCM,data:abc123def456,iv:xx,tag:yy,type:str]
  ci-token: "#{DbToken}#"
  sub-token: __API_TOKEN__
  vault-password: <path:secret/data/app#password>
