apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  secret_backend: vault
  token_ttl: 1h
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
spec:
  template:
    spec:
      containers:
        - name: app
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db
                  key: password
