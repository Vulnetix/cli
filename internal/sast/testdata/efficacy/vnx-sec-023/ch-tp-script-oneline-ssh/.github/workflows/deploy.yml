on:
  push:
  issues:
    types: [opened]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
~>          script: console.log("${{ github.event.issue.title }}")
      - uses: appleboy/ssh-action@v1
        with:
          host: deploy.acme.io
          script: |
            cd /srv/app
~>            git log -1 --format=%s | grep -q "${{ github.event.head_commit.message }}"
      - run: |
~>          echo '${{ toJSON(github.event) }}' > event.json
~>          echo "${{ github.event.head_commit.committer.email }}"
