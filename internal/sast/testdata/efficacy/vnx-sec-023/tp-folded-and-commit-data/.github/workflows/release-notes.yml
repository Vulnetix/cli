on:
  push:
    branches: [main]
  workflow_run:
    workflows: [build]
    types: [completed]
jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - name: Record commit
        run: >-
~>          echo "${{ github.event.head_commit.message }}" >> notes.txt &&
~>          echo "by ${{ github.event.head_commit.author.name }}" >> notes.txt
      - name: Branch of upstream run
        if: github.event_name == 'workflow_run'
        run: |
~>          ./deploy.sh --branch=${{ github.event.workflow_run.head_branch }}
      - name: Review text
        run: |
~>          printf '%s\n' "${{ github.event.review.body || github.event.discussion.title }}"
