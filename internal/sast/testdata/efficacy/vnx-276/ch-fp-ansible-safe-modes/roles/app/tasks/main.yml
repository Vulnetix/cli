---
- name: Install the binary
  ansible.builtin.copy:
    src: app
    dest: /usr/local/bin/app
    mode: '0755'

- name: Shared scratch area
  ansible.builtin.file:
    path: /srv/scratch
    state: directory
    mode: '1777'

- name: Config
  ansible.builtin.template:
    src: app.conf.j2
    dest: /etc/app.conf
    mode: u=rw,g=r,o=r
