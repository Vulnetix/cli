version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    # Match the package firewall's 3-day cooldown: younger releases are
    # refused (425 Too Early), so their PRs cannot be built through it.
    # Security updates are not delayed by this.
    cooldown:
      default-days: 3

  # Its own entry: Dependabot cannot read a $/ local action, so an update under /
  # fails, and in one entry that took the pins down with it.
  - package-ecosystem: github-actions
    directory: "/tools/actiongen/pins"
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
