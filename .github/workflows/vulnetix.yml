# Managed by `vulnetix gha init`. Edit .vulnetix/workflow.yaml and re-run it.
name: Vulnetix Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Secrets
    runs-on: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["self-hosted","Linux","X64","vulnetix-local"]') }}
    permissions:
      contents: read
      security-events: write
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: Vulnetix/cli/secrets@v4.24.30
        with:
          org-id: ${{ secrets.VULNETIX_ORG_ID }}
          api-key: ${{ secrets.VULNETIX_API_KEY }}
          extra-args: |
            --ignore-binaries
            --ignore-git
          artifact-name: secrets
          fail-on-findings: false
          rules: |
            Vulnetix/community-rules
            Vulnetix/opa-fugue-regula
            Vulnetix/opa-checkmarx-kics
            Vulnetix/opa-cds-aws-tf
            Vulnetix/opa-cigna-tf
            Vulnetix/opa-aquasecurity-trivy
          github-code-scanning: ${{ github.event_name == 'push' }}
          github-token: ${{ github.event_name != 'pull_request' && github.token || '' }}

  sast:
    name: SAST
    runs-on: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["self-hosted","Linux","X64","vulnetix-local"]') }}
    permissions:
      contents: read
      security-events: write
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: Vulnetix/cli/sast@v4.24.30
        with:
          org-id: ${{ secrets.VULNETIX_ORG_ID }}
          api-key: ${{ secrets.VULNETIX_API_KEY }}
          artifact-name: sast
          fail-on-findings: false
          rules: |
            Vulnetix/community-rules
            Vulnetix/opa-fugue-regula
            Vulnetix/opa-checkmarx-kics
            Vulnetix/opa-cds-aws-tf
            Vulnetix/opa-cigna-tf
            Vulnetix/opa-aquasecurity-trivy
          github-code-scanning: ${{ github.event_name == 'push' }}
          github-token: ${{ github.event_name != 'pull_request' && github.token || '' }}

  sca-go:
    name: SCA go
    runs-on: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["self-hosted","Linux","X64","vulnetix-local"]') }}
    permissions:
      contents: read
      security-events: write
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: Vulnetix/cli/sca/go@v4.24.30
        with:
          org-id: ${{ secrets.VULNETIX_ORG_ID }}
          api-key: ${{ secrets.VULNETIX_API_KEY }}
          artifact-name: sca-go
          fail-on-findings: false
          github-code-scanning: ${{ github.event_name == 'push' }}
          github-token: ${{ github.event_name != 'pull_request' && github.token || '' }}
      - uses: Vulnetix/cli/sca@v4.24.30
        if: ${{ !cancelled() }}
        with:
          org-id: ${{ secrets.VULNETIX_ORG_ID }}
          api-key: ${{ secrets.VULNETIX_API_KEY }}
          not-package-manager: go
          artifact-name: sca-go-rest
          fail-on-findings: false
          github-code-scanning: ${{ github.event_name == 'push' }}
          github-token: ${{ github.event_name != 'pull_request' && github.token || '' }}

  iac:
    name: IaC
    runs-on: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["self-hosted","Linux","X64","vulnetix-local"]') }}
    permissions:
      contents: read
      security-events: write
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: Vulnetix/cli/iac@v4.24.30
        with:
          org-id: ${{ secrets.VULNETIX_ORG_ID }}
          api-key: ${{ secrets.VULNETIX_API_KEY }}
          artifact-name: iac
          fail-on-findings: false
          rules: |
            Vulnetix/community-rules
            Vulnetix/opa-fugue-regula
            Vulnetix/opa-checkmarx-kics
            Vulnetix/opa-cds-aws-tf
            Vulnetix/opa-cigna-tf
            Vulnetix/opa-aquasecurity-trivy
            Vulnetix/opa-snyk-labs-iac
          github-code-scanning: ${{ github.event_name == 'push' }}
          github-token: ${{ github.event_name != 'pull_request' && github.token || '' }}

  containers:
    name: Containers
    runs-on: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["self-hosted","Linux","X64","vulnetix-local"]') }}
    permissions:
      contents: read
      security-events: write
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: Vulnetix/cli/containers@v4.24.30
        with:
          org-id: ${{ secrets.VULNETIX_ORG_ID }}
          api-key: ${{ secrets.VULNETIX_API_KEY }}
          artifact-name: containers
          fail-on-findings: false
          rules: |
            Vulnetix/community-rules
            Vulnetix/opa-fugue-regula
            Vulnetix/opa-checkmarx-kics
            Vulnetix/opa-cds-aws-tf
            Vulnetix/opa-cigna-tf
            Vulnetix/opa-aquasecurity-trivy
          github-code-scanning: ${{ github.event_name == 'push' }}
          github-token: ${{ github.event_name != 'pull_request' && github.token || '' }}

  license:
    name: License
    runs-on: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["self-hosted","Linux","X64","vulnetix-local"]') }}
    permissions:
      contents: read
      security-events: write
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: Vulnetix/cli/license@v4.24.30
        with:
          org-id: ${{ secrets.VULNETIX_ORG_ID }}
          api-key: ${{ secrets.VULNETIX_API_KEY }}
          artifact-name: license
          fail-on-findings: false
          github-code-scanning: ${{ github.event_name == 'push' }}
          github-token: ${{ github.event_name != 'pull_request' && github.token || '' }}

  cbom:
    name: CBOM
    runs-on: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["self-hosted","Linux","X64","vulnetix-local"]') }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: Vulnetix/cli/cbom@v4.24.30
        with:
          org-id: ${{ secrets.VULNETIX_ORG_ID }}
          api-key: ${{ secrets.VULNETIX_API_KEY }}
          artifact-name: cbom
          fail-on-findings: false
          github-token: ${{ github.event_name != 'pull_request' && github.token || '' }}

  aibom:
    name: AIBOM
    runs-on: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["self-hosted","Linux","X64","vulnetix-local"]') }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: Vulnetix/cli/aibom@v4.24.30
        with:
          org-id: ${{ secrets.VULNETIX_ORG_ID }}
          api-key: ${{ secrets.VULNETIX_API_KEY }}
          artifact-name: aibom
          fail-on-findings: false
          github-token: ${{ github.event_name != 'pull_request' && github.token || '' }}
          extra-args: |
            --commit-scan-max
            1

  analyze:
    name: Analyze
    runs-on: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["self-hosted","Linux","X64","vulnetix-local"]') }}
    permissions:
      contents: read
      issues: read
      pull-requests: read
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: Vulnetix/cli/analyze@v4.24.30
        with:
          org-id: ${{ secrets.VULNETIX_ORG_ID }}
          api-key: ${{ secrets.VULNETIX_API_KEY }}
          artifact-name: analyze
          fail-on-findings: false
          github-token: ${{ github.event_name != 'pull_request' && github.token || '' }}
          extra-args: ${{ github.event_name == 'pull_request' && '--no-forge' || github.event_name != 'workflow_dispatch' && '--forge-window-days=7' || '' }}

  sbom:
    name: SBOM
    runs-on: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["self-hosted","Linux","X64","vulnetix-local"]') }}
    permissions:
      attestations: write
      contents: write
      id-token: write
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: Vulnetix/cli/sbom@v4.24.30
        with:
          org-id: ${{ secrets.VULNETIX_ORG_ID }}
          api-key: ${{ secrets.VULNETIX_API_KEY }}
          artifact-name: sca
          fail-on-findings: false
          github-token: ${{ github.event_name != 'pull_request' && github.token || '' }}
          dependency-graph: ${{ github.event_name == 'push' }}
          attest: ${{ github.event_name == 'push' }}

  gha-status:
    name: gha-status
    runs-on: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["self-hosted","Linux","X64","vulnetix-local"]') }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: Vulnetix/cli/gha-status@v4.24.30
        with:
          org-id: ${{ secrets.VULNETIX_ORG_ID }}
          api-key: ${{ secrets.VULNETIX_API_KEY }}
          fail-on-findings: false

  github-advisories:
    name: github-advisories
    runs-on: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["self-hosted","Linux","X64","vulnetix-local"]') }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: Vulnetix/cli/sast@v4.24.30
        with:
          org-id: ${{ secrets.VULNETIX_ORG_ID }}
          api-key: ${{ secrets.VULNETIX_API_KEY }}
          fail-on-findings: false
      - uses: Vulnetix/cli/github-advisories@v4.24.30
        with:
          org-id: ${{ secrets.VULNETIX_ORG_ID }}
          api-key: ${{ secrets.VULNETIX_API_KEY }}
          dry-run: true
          fail-on-findings: false

  bom-validate:
    name: bom-validate
    runs-on: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["self-hosted","Linux","X64","vulnetix-local"]') }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: Vulnetix/cli/sbom@v4.24.30
        with:
          org-id: ${{ secrets.VULNETIX_ORG_ID }}
          api-key: ${{ secrets.VULNETIX_API_KEY }}
          fail-on-findings: false
      - uses: Vulnetix/cli/bom-validate@v4.24.30
        with:
          org-id: ${{ secrets.VULNETIX_ORG_ID }}
          api-key: ${{ secrets.VULNETIX_API_KEY }}
          file: .vulnetix/sbom.cdx.json
          fail-on-findings: false

  license-policy-validate:
    name: license-policy-validate
    runs-on: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["self-hosted","Linux","X64","vulnetix-local"]') }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: Vulnetix/cli/setup@v4.24.30
      - run: vulnetix license policy init --no-banner
      - uses: Vulnetix/cli/license-policy-validate@v4.24.30
        with:
          org-id: ${{ secrets.VULNETIX_ORG_ID }}
          api-key: ${{ secrets.VULNETIX_API_KEY }}
          fail-on-findings: false

  license-exceptions-check:
    name: license-exceptions-check
    runs-on: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["self-hosted","Linux","X64","vulnetix-local"]') }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: Vulnetix/cli/setup@v4.24.30
      - run: vulnetix license exceptions add --no-banner --license MPL-2.0 --reason dogfood --approver security@vulnetix.com --expires 2030-01-01
      - uses: Vulnetix/cli/license-exceptions-check@v4.24.30
        with:
          org-id: ${{ secrets.VULNETIX_ORG_ID }}
          api-key: ${{ secrets.VULNETIX_API_KEY }}
          fail-on-findings: false

  ai-firewall-apply:
    name: ai-firewall-apply
    runs-on: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["self-hosted","Linux","X64","vulnetix-local"]') }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: Vulnetix/cli/ai-firewall-apply@v4.24.30
        with:
          org-id: ${{ secrets.VULNETIX_ORG_ID }}
          api-key: ${{ secrets.VULNETIX_API_KEY }}
          baseline-required: false
          dry-run: true
          file: testdata/action-fixture/vulnetix-config/ai-firewall.yaml
          fail-on-findings: false

  image:
    name: image
    runs-on: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["self-hosted","Linux","X64","vulnetix-local"]') }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: Vulnetix/cli/image@v4.24.30
        with:
          org-id: ${{ secrets.VULNETIX_ORG_ID }}
          api-key: ${{ secrets.VULNETIX_API_KEY }}
          artifact-name: alpine-sbom
          no-upload: true
          reference: alpine:3.20
          fail-on-findings: false

  vex:
    name: vex
    runs-on: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["self-hosted","Linux","X64","vulnetix-local"]') }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: Vulnetix/cli/vex@v4.24.30
        with:
          org-id: ${{ secrets.VULNETIX_ORG_ID }}
          api-key: ${{ secrets.VULNETIX_API_KEY }}
          extra-args: |
            --vex
            testdata/action-fixture/fixture.openvex.json
          vex-command: validate
          fail-on-findings: false

  jail:
    name: jail
    runs-on: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["self-hosted","Linux","X64","vulnetix-local"]') }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: Vulnetix/cli/jail@v4.24.30
        with:
          org-id: ${{ secrets.VULNETIX_ORG_ID }}
          api-key: ${{ secrets.VULNETIX_API_KEY }}
          fail-on-findings: false

  setup:
    name: setup
    runs-on: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["self-hosted","Linux","X64","vulnetix-local"]') }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: Vulnetix/cli/setup@v4.24.30
      - run: vulnetix version --no-banner
      - run: "vulnetix auth verify --no-banner || true"

  upload:
    name: upload
    runs-on: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["self-hosted","Linux","X64","vulnetix-local"]') }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: Vulnetix/cli/sbom@v4.24.30
        with:
          org-id: ${{ secrets.VULNETIX_ORG_ID }}
          api-key: ${{ secrets.VULNETIX_API_KEY }}
          fail-on-findings: false
      - uses: Vulnetix/cli/upload@v4.24.30
        with:
          org-id: ${{ secrets.VULNETIX_ORG_ID }}
          api-key: ${{ secrets.VULNETIX_API_KEY }}
          upload-file: .vulnetix/sbom.cdx.json
          fail-on-findings: false

  config-plan:
    name: config-plan
    runs-on: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["self-hosted","Linux","X64","vulnetix-local"]') }}
    permissions:
      contents: read
      pull-requests: write
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: Vulnetix/cli/config-plan@v4.24.30
        with:
          org-id: ${{ secrets.VULNETIX_ORG_ID }}
          api-key: ${{ secrets.VULNETIX_API_KEY }}
          config-path: testdata/action-fixture/vulnetix-config/config
          fail-on-findings: false

  publish:
    name: Publish
    runs-on: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["self-hosted","Linux","X64","vulnetix-local"]') }}
    if: ${{ !cancelled() }}
    needs: [secrets, sast, sca-go, iac, containers, license, cbom, aibom, analyze, sbom, gha-status, github-advisories, bom-validate, license-policy-validate, license-exceptions-check, ai-firewall-apply, image, vex, jail, setup, upload, config-plan]
    permissions:
      contents: read
      actions: read
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: Vulnetix/cli/gha-upload@v4.24.30
        with:
          org-id: ${{ secrets.VULNETIX_ORG_ID }}
          api-key: ${{ secrets.VULNETIX_API_KEY }}
          fail-on-findings: false
