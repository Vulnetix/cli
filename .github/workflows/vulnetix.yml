name: Vulnetix Security

on:
  push:
  # A release cut from a tag that already existed produces no push event, so
  # the tag-push trigger above does not cover it.
  release:
    types: [published]
  workflow_dispatch:

env:
  VULNETIX_VERSION: v3.75.0
jobs:
  analyze:
    name: ${{ matrix.name }}
    runs-on: [self-hosted, Linux, X64, vulnetix-local]
    permissions:
      contents: read
      pull-requests: read
      issues: read
    env:
      VULNETIX_ORG_ID: ${{ secrets.VULNETIX_ORG_ID }}
      VULNETIX_API_KEY: ${{ secrets.VULNETIX_API_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: sca
            name: SCA
            run: vulnetix sca --no-banner --no-progress --verbose
            artifact: .vulnetix/sbom.cdx.json
          - id: secrets
            name: Secrets
            run: vulnetix secrets --rule Vulnetix/community-rules --rule Vulnetix/opa-fugue-regula --rule Vulnetix/opa-checkmarx-kics --rule Vulnetix/opa-cds-aws-tf --rule Vulnetix/opa-cigna-tf --rule Vulnetix/opa-aquasecurity-trivy --ignore-binaries --ignore-git --no-banner --no-progress --verbose
            artifact: .vulnetix/sast.sarif
          - id: sast
            name: SAST
            run: vulnetix sast --rule Vulnetix/community-rules --rule Vulnetix/opa-fugue-regula --rule Vulnetix/opa-checkmarx-kics --rule Vulnetix/opa-cds-aws-tf --rule Vulnetix/opa-cigna-tf --rule Vulnetix/opa-aquasecurity-trivy --no-banner --no-progress --verbose
            artifact: .vulnetix/sast.sarif
          - id: iac
            name: IaC
            run: vulnetix iac --rule Vulnetix/community-rules --rule Vulnetix/opa-fugue-regula --rule Vulnetix/opa-checkmarx-kics --rule Vulnetix/opa-cds-aws-tf --rule Vulnetix/opa-cigna-tf --rule Vulnetix/opa-aquasecurity-trivy --no-banner --no-progress --verbose
            artifact: .vulnetix/sast.sarif
          - id: containers
            name: Containers
            run: vulnetix containers --rule Vulnetix/community-rules --rule Vulnetix/opa-fugue-regula --rule Vulnetix/opa-checkmarx-kics --rule Vulnetix/opa-cds-aws-tf --rule Vulnetix/opa-cigna-tf --rule Vulnetix/opa-aquasecurity-trivy --no-banner --no-progress --verbose
            artifact: .vulnetix/containers.sarif
          - id: licenses
            name: Licenses
            run: vulnetix license --no-banner --no-progress --verbose
            artifact: .vulnetix/sbom.cdx.json
          - id: cbom
            name: CBOM
            run: vulnetix cbom --no-banner --no-progress --verbose
            artifact: .vulnetix/cbom.cdx.json
          - id: aibom
            name: AIBOM
            run: vulnetix aibom --commit-scan-max 1 --no-banner --no-progress --verbose
            artifact: .vulnetix/ai-bom.cdx.json
          - id: analyze
            name: Analyze
            run: vulnetix analyze --no-banner --no-progress --verbose
            artifact: .vulnetix/analyze.report.json

    steps:
      - uses: actions/checkout@v5
        with:
          # `vulnetix analyze` walks git history. The default depth-1 checkout
          # has none of it, so every contributor, activity, ownership and
          # bus-factor metric would describe one commit instead of the repository.
          fetch-depth: 0

      - name: Install Vulnetix CLI
        run: |
          curl -fsSL https://cli.vulnetix.com/install.sh             | sh -s -- --install-dir "$HOME/.local/bin" --version "$VULNETIX_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify Vulnetix authentication
        run: vulnetix auth verify --no-banner --no-progress --verbose

      - name: Run ${{ matrix.name }}
        continue-on-error: true
        run: |
          ${{ matrix.run }}

      - name: Upload ${{ matrix.name }} artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.id }}
          path: ${{ matrix.artifact }}
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7

  publish:
    name: Publish
    runs-on: [self-hosted, Linux, X64, vulnetix-local]
    needs: analyze
    permissions:
      contents: read
      actions: read
    env:
      VULNETIX_ORG_ID: ${{ secrets.VULNETIX_ORG_ID }}
      VULNETIX_API_KEY: ${{ secrets.VULNETIX_API_KEY }}

    steps:
      - uses: actions/checkout@v5

      - name: Install Vulnetix CLI
        run: |
          curl -fsSL https://cli.vulnetix.com/install.sh             | sh -s -- --install-dir "$HOME/.local/bin" --version "$VULNETIX_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Upload all artifacts to Vulnetix
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: vulnetix gha upload --org-id "$VULNETIX_ORG_ID" --json --no-banner --no-progress --verbose

  publish-tea:
    name: TEA
    needs: analyze
    # Not on a tag. release.yml already publishes this repository's tagged
    # releases, and it waits for the Homebrew tap and Scoop bucket to carry the
    # version before advertising `brew install` for it. This job cannot
    # reproduce that ordering, so it stays out of the way on tags. When a
    # scanner leg is cancelled or fails, we still publish if the workflow ran.
    # A main push is auto-versioned by this repository and release.yml publishes
    # its final tagged release. Publishing branch evidence here can race that
    # tag creation and claim the same version as a pre-release first.
    if: ${{ !cancelled() && github.ref_type != 'tag' && !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    uses: Vulnetix/cli/.github/workflows/tea-release.yml@tea-release-v1
    with:
      visibility: public
    secrets: inherit
