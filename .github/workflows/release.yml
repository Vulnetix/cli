name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.2.3)'
        required: true
        type: string

permissions:
  contents: write

# Never run two releases for the same version at once: the create-or-update
# step is idempotent but not concurrency-safe against itself.
concurrency:
  group: release-${{ inputs.version || github.ref }}
  cancel-in-progress: false

env:
  # Force JS actions to Node 24 so deprecated Node 20 runs stop firing while
  # action versions catch up (silences upload-artifact@v5 et al.).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Releasing $VERSION"

  build-cross:
    # Linux + Windows targets are cross-compiled from ubuntu using zig cc.
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Configure vdb-sca-match private fetch (not yet in module proxy)
        run: |
          go env -w GOPRIVATE=github.com/Vulnetix/vdb-sca-match
          git config --global url."https://x-access-token:${{ secrets.PACKAGES_TOKEN }}@github.com/Vulnetix/vdb-sca-match".insteadOf "https://github.com/Vulnetix/vdb-sca-match"

      - name: Install zig
        run: |
          if command -v zig >/dev/null 2>&1; then
            zig version
            exit 0
          fi
          ZIG_VER="0.13.0"
          rm -rf "/tmp/zig-linux-x86_64-${ZIG_VER}"
          curl -sSL "https://ziglang.org/download/${ZIG_VER}/zig-linux-x86_64-${ZIG_VER}.tar.xz" -o /tmp/zig.tar.xz
          tar -xJf /tmp/zig.tar.xz -C /tmp
          sudo rm -rf "/opt/zig/zig-linux-x86_64-${ZIG_VER}"
          sudo mkdir -p /opt/zig
          sudo mv /tmp/zig-linux-x86_64-${ZIG_VER} /opt/zig
          sudo ln -sf "/opt/zig/zig-linux-x86_64-${ZIG_VER}/zig" /usr/local/bin/zig
          zig version

      - name: Build linux + windows binaries
        run: |
          VERSION=${{ needs.version.outputs.version }}
          COMMIT=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          LDFLAGS="-s -w -X github.com/vulnetix/cli/v3/cmd.version=${VERSION} -X github.com/vulnetix/cli/v3/cmd.commit=${COMMIT} -X github.com/vulnetix/cli/v3/cmd.buildDate=${BUILD_DATE}"
          mkdir -p bin

          build_target() {
            local goos="$1" goarch="$2" triple="$3" suffix="$4"
            echo "Building ${goos}/${goarch} (${triple})..."
            CGO_ENABLED=1 \
              CGO_CFLAGS="-w" \
              CC="zig cc -target ${triple}" \
              CXX="zig c++ -target ${triple}" \
              GOOS="${goos}" GOARCH="${goarch}" \
              go build -ldflags "$LDFLAGS" \
              -o bin/vulnetix-${goos}-${goarch}${suffix} .
          }

          build_target linux   amd64 x86_64-linux-musl     ""
          build_target linux   arm64 aarch64-linux-musl    ""
          build_target linux   arm   arm-linux-musleabihf  ""
          build_target linux   386   x86-linux-musl        ""
          build_target windows amd64 x86_64-windows-gnu    ".exe"
          build_target windows arm64 aarch64-windows-gnu   ".exe"

      - uses: actions/upload-artifact@v6
        with:
          name: cross-binaries
          path: bin/*

  build-darwin:
    # Darwin builds run natively on macOS so Apple's SDK is available for CGO.
    needs: version
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Configure vdb-sca-match private fetch (not yet in module proxy)
        run: |
          go env -w GOPRIVATE=github.com/Vulnetix/vdb-sca-match
          git config --global url."https://x-access-token:${{ secrets.PACKAGES_TOKEN }}@github.com/Vulnetix/vdb-sca-match".insteadOf "https://github.com/Vulnetix/vdb-sca-match"

      - name: Build darwin binaries
        run: |
          VERSION=${{ needs.version.outputs.version }}
          COMMIT=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          LDFLAGS="-s -w -X github.com/vulnetix/cli/v3/cmd.version=${VERSION} -X github.com/vulnetix/cli/v3/cmd.commit=${COMMIT} -X github.com/vulnetix/cli/v3/cmd.buildDate=${BUILD_DATE}"
          mkdir -p bin

          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 \
            CGO_CFLAGS="-w" \
            go build -ldflags "$LDFLAGS" -o bin/vulnetix-darwin-arm64 .
          CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 \
            CGO_CFLAGS="-arch x86_64 -w" CGO_LDFLAGS="-arch x86_64" \
            go build -ldflags "$LDFLAGS" -o bin/vulnetix-darwin-amd64 .

      - uses: actions/upload-artifact@v6
        with:
          name: darwin-binaries
          path: bin/*

  release:
    needs: [version, build-cross, build-darwin]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v7
        with:
          name: cross-binaries
          path: bin
      - uses: actions/download-artifact@v7
        with:
          name: darwin-binaries
          path: bin

      - name: Copy install script
        run: cp install.sh bin/install.sh

      - name: Generate checksums
        run: |
          cd bin
          sha256sum * > checksums.txt

      - name: Create or update Release
        run: |
          VERSION=${{ needs.version.outputs.version }}
          if ! git tag -l "$VERSION" | grep -q "$VERSION"; then
            git tag -a "$VERSION" -m "Release $VERSION"
          fi
          if gh release view "$VERSION" > /dev/null 2>&1; then
            gh release upload "$VERSION" bin/* --clobber
          else
            gh release create "$VERSION" bin/* \
              --title "Release $VERSION" \
              --generate-notes
          fi
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}

      # Move the major tag so `uses: Vulnetix/cli@v3` tracks the newest v3
      # release. Without it every workflow that consumes the action has to pin
      # an exact version and be revisited to bump it, which is how a fleet ends
      # up spread across three CLI versions with nobody noticing.
      #
      # Prereleases are excluded: `@v3` must never point at a -rc or -beta.
      - name: Move the v3 major tag
        run: |
          VERSION=${{ needs.version.outputs.version }}
          case "$VERSION" in
            v3.*-*)
              echo "$VERSION is a prerelease; leaving v3 where it is"
              exit 0
              ;;
            v3.*) ;;
            *)
              echo "$VERSION is not a v3 release; nothing to move"
              exit 0
              ;;
          esac
          git tag -f v3 "$VERSION"
          git push origin -f refs/tags/v3
          echo "v3 -> $VERSION"

  test-go-install:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # This job deliberately does not check out the repo — it proves the
      # published module installs from the proxy. go.mod is therefore not on
      # disk and go-version-file cannot be used; keep this pin in step with go.mod.
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Configure vdb-sca-match private fetch (not yet in module proxy)
        run: |
          go env -w GOPRIVATE=github.com/Vulnetix/vdb-sca-match
          git config --global url."https://x-access-token:${{ secrets.PACKAGES_TOKEN }}@github.com/Vulnetix/vdb-sca-match".insteadOf "https://github.com/Vulnetix/vdb-sca-match"

      - name: Test go install
        run: |
          sleep 30
          go install github.com/vulnetix/cli/v3@latest
          vulnetix --help || echo "Binary not found in PATH"

      - name: Test specific version install
        run: |
          VERSION=${{ needs.release.outputs.version }}
          go install github.com/vulnetix/cli/v3@${VERSION}
          vulnetix version --short || echo "Version command failed"

  update-packages:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout cli repo
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.PACKAGES_TOKEN }}

      - name: Checkout homebrew-tap
        uses: actions/checkout@v5
        with:
          repository: Vulnetix/homebrew-tap
          ref: main
          token: ${{ secrets.PACKAGES_TOKEN }}
          path: homebrew-tap

      - name: Checkout scoop-bucket
        uses: actions/checkout@v5
        with:
          repository: Vulnetix/scoop-bucket
          ref: main
          token: ${{ secrets.PACKAGES_TOKEN }}
          path: scoop-bucket

      - name: Download checksums
        run: |
          curl -fsSL \
            "https://github.com/Vulnetix/cli/releases/download/${{ needs.release.outputs.version }}/checksums.txt" \
            -o checksums.txt

      - name: Update flake.nix
        run: |
          VER_NUM="${{ needs.release.outputs.version }}"
          VER_NUM="${VER_NUM#v}"
          git fetch origin main
          git checkout -B main origin/main
          sed -i "s/version = \"[^\"]*\";/version = \"${VER_NUM}\";/" flake.nix
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add flake.nix
          if ! git diff --cached --quiet; then
            git commit -m "chore: update flake.nix to v${VER_NUM} [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Update Homebrew formula
        run: |
          set -euo pipefail
          VER_NUM="${{ needs.release.outputs.version }}"
          VER_NUM="${VER_NUM#v}"

          # An absent checksum used to be substituted in as an empty string,
          # producing `sha256 ""` — a formula that installs nothing, pushed to
          # the tap and discovered by a user rather than by this job.
          hash_for() {
            local sum
            sum=$(grep " \*\?$1\$" checksums.txt | awk '{print $1}')
            if [ ${#sum} -ne 64 ]; then
              echo "::error::no SHA-256 for $1 in checksums.txt" >&2
              exit 1
            fi
            printf '%s' "$sum"
          }
          DARWIN_ARM64=$(hash_for vulnetix-darwin-arm64)
          DARWIN_AMD64=$(hash_for vulnetix-darwin-amd64)
          LINUX_ARM64=$(hash_for vulnetix-linux-arm64)
          LINUX_AMD64=$(hash_for vulnetix-linux-amd64)

          cd homebrew-tap
          BREW="Formula/vulnetix.rb"
          sed -i "s/version \"[^\"]*\"/version \"${VER_NUM}\"/" "$BREW"
          sed -i "/vulnetix-darwin-arm64/{n;s/sha256 \"[a-f0-9]*\"/sha256 \"${DARWIN_ARM64}\"/}" "$BREW"
          sed -i "/vulnetix-darwin-amd64/{n;s/sha256 \"[a-f0-9]*\"/sha256 \"${DARWIN_AMD64}\"/}" "$BREW"
          sed -i "/vulnetix-linux-arm64/{n;s/sha256 \"[a-f0-9]*\"/sha256 \"${LINUX_ARM64}\"/}" "$BREW"
          sed -i "/vulnetix-linux-amd64/{n;s/sha256 \"[a-f0-9]*\"/sha256 \"${LINUX_AMD64}\"/}" "$BREW"

          # Every sed above is positional — it edits the line AFTER a URL that
          # mentions a platform. Reordering the formula, or renaming an asset,
          # makes them match nothing and leave the previous release's checksums
          # in place, which is the one failure mode that looks like success.
          for want in "${VER_NUM}" "${DARWIN_ARM64}" "${DARWIN_AMD64}" "${LINUX_ARM64}" "${LINUX_AMD64}"; do
            if ! grep -q "$want" "$BREW"; then
              echo "::error::$BREW does not contain $want after the edit; the formula layout has moved" >&2
              exit 1
            fi
          done

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$BREW"
          if ! git diff --cached --quiet; then
            git commit -m "vulnetix ${VER_NUM}"
            git push
          fi

      - name: Update Scoop manifest
        run: |
          set -euo pipefail
          VER_NUM="${{ needs.release.outputs.version }}"
          VER_NUM="${VER_NUM#v}"
          hash_for() {
            local sum
            sum=$(grep " \*\?$1\$" checksums.txt | awk '{print $1}')
            if [ ${#sum} -ne 64 ]; then
              echo "::error::no SHA-256 for $1 in checksums.txt" >&2
              exit 1
            fi
            printf '%s' "$sum"
          }
          WIN_AMD64=$(hash_for vulnetix-windows-amd64.exe)
          WIN_ARM64=$(hash_for vulnetix-windows-arm64.exe)

          cd scoop-bucket
          # A missing manifest used to be a warning-free skip, leaving Scoop
          # users on whatever version the bucket last knew about.
          if [ ! -f bucket/vulnetix.json ]; then
            echo "::error::scoop-bucket has no bucket/vulnetix.json" >&2
            exit 1
          fi
          # 32-bit Windows builds were dropped when CGO became a build
          # requirement (zig cc + CGO is unstable for i386-windows).
          # Remove the 32bit architecture entry from the manifest.
          jq --indent 4 \
            --arg v "$VER_NUM" \
            --arg h64 "$WIN_AMD64" \
            --arg harm "$WIN_ARM64" \
            '.version = $v |
             .architecture."64bit".url = "https://github.com/Vulnetix/cli/releases/download/v\($v)/vulnetix-windows-amd64.exe#/vulnetix.exe" |
             .architecture."64bit".hash = $h64 |
             .architecture.arm64.url = "https://github.com/Vulnetix/cli/releases/download/v\($v)/vulnetix-windows-arm64.exe#/vulnetix.exe" |
             .architecture.arm64.hash = $harm |
             del(.architecture."32bit") |
             del(.autoupdate.architecture."32bit")' bucket/vulnetix.json > /tmp/vulnetix.json
          mv /tmp/vulnetix.json bucket/vulnetix.json

          # jq would have failed already on malformed input, but not on a
          # manifest whose shape has moved — `.architecture.arm64` on an object
          # that no longer has one simply creates it somewhere harmless.
          test "$(jq -r .version bucket/vulnetix.json)" = "$VER_NUM"
          test "$(jq -r '.architecture."64bit".hash' bucket/vulnetix.json)" = "$WIN_AMD64"
          test "$(jq -r '.architecture.arm64.hash' bucket/vulnetix.json)" = "$WIN_ARM64"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bucket/vulnetix.json
          if ! git diff --cached --quiet; then
            git commit -m "vulnetix ${VER_NUM}"
            git push
          fi

  # Publish the release to the Transparency Exchange API.
  #
  # Runs after update-packages, not beside it, because two of the things it
  # publishes are the Homebrew and Scoop channels. Advertising `brew install`
  # for a version the tap does not carry yet would be a download link that
  # 404s for as long as the other job takes — TEA is consumed by machines, and
  # a machine does not know to try again in a minute.
  #
  # The binary doing the publishing is the one this release just built, so a
  # `tea` regression fails the release that introduced it rather than the next
  # one.
  publish-tea:
    needs: [release, update-packages]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VULNETIX_ORG_ID: ${{ secrets.VULNETIX_ORG_ID }}
      VULNETIX_API_KEY: ${{ secrets.VULNETIX_API_KEY }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          name: cross-binaries
          path: bin

      - name: Install the binary this release built
        run: |
          set -euo pipefail
          chmod +x bin/vulnetix-linux-amd64
          sudo mv bin/vulnetix-linux-amd64 /usr/local/bin/vulnetix
          vulnetix version --short

      - name: Download checksums
        run: |
          curl -fsSL \
            "https://github.com/Vulnetix/cli/releases/download/${{ needs.release.outputs.version }}/checksums.txt" \
            -o checksums.txt

      - name: Generate the release SBOM
        run: vulnetix sca --no-banner --no-progress -o vulnetix.cdx.json

      - name: Publish product, release, artifacts and distributions
        run: |
          set -euo pipefail
          VERSION="${{ needs.release.outputs.version }}"
          VER_NUM="${VERSION#v}"

          # --checksums turns every published asset into a distribution, taking
          # the digests from the same file a user verifies a download against.
          # The remaining channels have no single file to fetch, so they are
          # named rather than linked.
          vulnetix tea release vulnetix.cdx.json \
            --version "$VERSION" \
            --checksums checksums.txt \
            --exclude checksums.txt \
            --channel "name=Homebrew — brew install Vulnetix/tap/vulnetix,url=https://github.com/Vulnetix/homebrew-tap" \
            --channel "name=Scoop — scoop bucket add vulnetix https://github.com/Vulnetix/scoop-bucket,url=https://github.com/Vulnetix/scoop-bucket" \
            --channel "name=Nix flake — nix run github:Vulnetix/cli,url=https://github.com/Vulnetix/cli/blob/main/flake.nix" \
            --channel "name=go install github.com/vulnetix/cli/v3@${VERSION},purl=pkg:golang/github.com/vulnetix/cli/v3@${VERSION}" \
            --channel "name=Install script — curl -fsSL https://cli.vulnetix.com/install.sh | sh,url=https://cli.vulnetix.com/install.sh" \
            --visibility public
