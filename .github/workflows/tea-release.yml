name: TEA Release

on:
  workflow_call:
    inputs:
      visibility:
        description: 'public, shared, or empty to leave the objects private'
        type: string
        default: ''

concurrency:
  group: tea-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to TEA
    runs-on: ubuntu-latest
    steps:
      - name: Smoke
        run: echo "visibility=${{ inputs.visibility }}"
