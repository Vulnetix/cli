name: TEA Release

on:
  workflow_call:
    inputs:
      visibility:
        description: 'public, shared, or empty to leave the objects private'
        type: string
        default: ''
      channels:
        description: 'newline-separated --channel specs, one per line'
        type: string
        default: ''
      cli_version:
        description: 'Vulnetix CLI version to install'
        type: string
        default: 'v3.84.1'

concurrency:
  group: tea-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to TEA
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VULNETIX_ORG_ID: ${{ secrets.VULNETIX_ORG_ID }}
      VULNETIX_API_KEY: ${{ secrets.VULNETIX_API_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Smoke
        run: echo "org set=${VULNETIX_ORG_ID:+yes}"
