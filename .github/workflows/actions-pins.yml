name: Actions pins

# A Dependabot bump of tools/actiongen/pins changes what every composite should
# say. This regenerates them on that pull request, so the bump can pass the
# generated-files check. It runs the base branch's generator over the pins file
# from the pull request and executes nothing the pull request wrote.
on:
  pull_request_target:
    branches: [main]
    paths:
      - 'tools/actiongen/pins/action.yml'

permissions:
  contents: read

jobs:
  regenerate:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: [self-hosted, Linux, X64, vulnetix-local]
    timeout-minutes: 15
    steps:
      # The stored read-only token would override the push token below.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Git, not the API: this repository's workflow token runs out of quota.
      - name: Take only what Dependabot changed
        id: take
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git fetch --depth 20 "https://github.com/$GITHUB_REPOSITORY.git" "refs/pull/$PR_NUMBER/head"
          # A commit this job pushed has nothing left to do. Pushing it ran this
          # workflow again, and on one pull request that made 70 runs.
          if git log -1 --format=%s FETCH_HEAD | grep -q '^chore(actions): regenerate'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          c=$(git log FETCH_HEAD -1 --author=dependabot --format=%H -- tools/actiongen/pins/action.yml)
          [ -n "$c" ] || { echo "::error::no Dependabot commit changes the pins"; exit 1; }
          # Its diff, applied to main, not the branch's whole file: a stale branch
          # still carries the old line of a pin that merged since, and taking the
          # file would put it back. A diff that no longer applies fails here.
          git diff "$c~1" "$c" -- tools/actiongen/pins/action.yml | git apply

      - name: Regenerate
        if: steps.take.outputs.skip != 'true'
        env:
          GOPRIVATE: github.com/Vulnetix/vdb-sca-match,github.com/Vulnetix/vdb-manifest
        run: go run ./tools/actiongen -root .

      # A composite's pins are in the lock, so regenerating changes what it must
      # hold, and Dependabot's own relock cannot run here: it cannot read $/ refs.
      - name: Relock
        if: steps.take.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: |
          gh extension install github/gh-actions-lock --pin v0.4.1
          gh actions-lock --no-narrow

      - name: Push to the pull request's branch
        if: steps.take.outputs.skip != 'true'
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "support@vulnetix.com"
          git add -A -- '*action.yml' action-lib/commands.sh .github/workflows/actions-e2e.yml .github/workflows/actions.lock
          git diff --cached --quiet && exit 0
          git commit -m "chore(actions): regenerate for the new pins"
          git push --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${HEAD_REF}"
