name: Test Action

on:
  pull_request:
    branches: [ main, master ]
    paths-ignore:
      - 'internal/sast/rules/**'
  # Lets a maintainer run the suite, including the worktree job, on any branch without a pull request.
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  lint:
    name: Lint
    runs-on: [self-hosted, Linux, X64, vulnetix-local]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Configure private fetch of vdb-sca-match and vdb-manifest (not yet in module proxy)
        run: |
          go env -w GOPRIVATE=github.com/Vulnetix/vdb-sca-match,github.com/Vulnetix/vdb-manifest
          git config --global url."https://x-access-token:${{ secrets.PACKAGES_TOKEN }}@github.com/Vulnetix/vdb-sca-match".insteadOf "https://github.com/Vulnetix/vdb-sca-match"
          git config --global url."https://x-access-token:${{ secrets.PACKAGES_TOKEN }}@github.com/Vulnetix/vdb-manifest".insteadOf "https://github.com/Vulnetix/vdb-manifest"

      - name: gofmt
        run: |
          # testdata holds deliberately invalid Go (the SAST efficacy cases), which gofmt
          # would report as a syntax error; the go tool skips it, so skip it here too.
          unformatted=$(find ./cmd ./pkg ./internal -name '*.go' -not -path '*/testdata/*' -print0 | xargs -0 gofmt -l)
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi
        shell: bash

      - name: go vet
        run: go vet ./...
        env:
          # The bundled tree-sitter grammars need cgo; -w suppresses their
          # vendored parser.c warnings (mirrors the justfile).
          CGO_ENABLED: "1"
          CGO_CFLAGS: "-w"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Pinned: a linter upgrade must be a deliberate commit, not a
          # surprise red pipeline on an unrelated PR. v1.64.8 was built with
          # Go 1.24 and refuses a module that targets Go 1.25, so the job failed
          # before checking any code and skipped every job that needs it.
          version: v2.14.0
          args: --timeout=10m
        env:
          CGO_ENABLED: "1"
          CGO_CFLAGS: "-w"

  test:
    runs-on: [self-hosted, Linux, X64, vulnetix-local]
    needs: [lint]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Configure private fetch of vdb-sca-match and vdb-manifest (not yet in module proxy)
        run: |
          go env -w GOPRIVATE=github.com/Vulnetix/vdb-sca-match,github.com/Vulnetix/vdb-manifest
          git config --global url."https://x-access-token:${{ secrets.PACKAGES_TOKEN }}@github.com/Vulnetix/vdb-sca-match".insteadOf "https://github.com/Vulnetix/vdb-sca-match"
          git config --global url."https://x-access-token:${{ secrets.PACKAGES_TOKEN }}@github.com/Vulnetix/vdb-manifest".insteadOf "https://github.com/Vulnetix/vdb-manifest"

      # The host binary only. build.sh cross-compiles six targets with CGO_ENABLED=0, which the
      # bundled tree-sitter grammars rule out; the release workflow cross-compiles with zig.
      - name: Build binary
        run: |
          OS=$(uname -s | tr '[:upper:]' '[:lower:]')
          ARCH=$(uname -m | sed 's/x86_64/amd64/; s/aarch64/arm64/')
          VERSION="test-$(git rev-parse --short HEAD)"
          mkdir -p bin
          go build \
            -ldflags "-s -w -X github.com/vulnetix/cli/v4/cmd.version=${VERSION} -X github.com/vulnetix/cli/v4/cmd.commit=$(git rev-parse --short HEAD)" \
            -o "bin/vulnetix-${OS}-${ARCH}" .
        shell: bash
        env:
          CGO_ENABLED: "1"
          CGO_CFLAGS: "-w"

      - name: Test CLI directly
        run: |
          # Determine OS name matching build output
          OS=$(uname -s | tr '[:upper:]' '[:lower:]')
          case "$OS" in
            mingw*|msys*|cygwin*) OS="windows" ;;
          esac
          ARCH=$(uname -m | sed 's/x86_64/amd64/; s/aarch64/arm64/')
          BINARY="./bin/vulnetix-${OS}-${ARCH}"
          if [ "$OS" = "windows" ]; then
            BINARY="${BINARY}.exe"
          fi
          $BINARY --org-id "123e4567-e89b-12d3-a456-426614174000"
        shell: bash

      # gha actions end to end against live services: GitHub resolves the uses:
      # reference with this job's token, and Vulnetix (community access, as for
      # a user who is not logged in) answers which action versions have a
      # published advisory. tj-actions/changed-files v45.0.7 is affected by
      # CVE-2025-30066 (fixed in 46.0.1), so VNX-GH-105 must report it.
      - name: Test gha actions against GitHub and Vulnetix
        if: runner.os == 'Linux'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ARCH=$(uname -m | sed 's/x86_64/amd64/; s/aarch64/arm64/')
          BINARY="$PWD/bin/vulnetix-linux-${ARCH}"
          dir="$RUNNER_TEMP/gha-live"
          mkdir -p "$dir/.github/workflows"
          printf 'on: push\npermissions: {}\njobs:\n  a:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: tj-actions/changed-files@v45.0.7\n' > "$dir/.github/workflows/ci.yml"
          # The job token shares the repository's hourly API quota with every
          # other run. An exhausted quota says nothing about this change, so it
          # is a warning; any other failure still fails the step.
          if ! "$BINARY" gha actions "$dir" --repo "${{ github.repository }}" --format json --no-banner --no-analytics > "$RUNNER_TEMP/gha-live.json" 2> "$RUNNER_TEMP/gha-live.err"; then
            cat "$RUNNER_TEMP/gha-live.err"
            if grep -q "rate limit" "$RUNNER_TEMP/gha-live.err"; then
              echo "::warning::GitHub API rate limit exhausted; the live gha actions check did not run"
              exit 0
            fi
            exit 1
          fi
          python3 - "$RUNNER_TEMP/gha-live.json" <<'PY'
          import json, sys
          doc = json.load(open(sys.argv[1]))
          hits = [f for f in doc["findings"] if f["ruleId"] == "VNX-GH-105"]
          print("VNX-GH-105:", [f["message"] for f in hits])
          print("notes:", doc.get("notes"))
          assert any("CVE-2025-30066" in f["message"] for f in hits), "VNX-GH-105 did not report CVE-2025-30066"
          PY
        shell: bash

      # The action as a consumer runs it, but with the binary this branch just
      # built rather than the last release, so a change to the CLI and the
      # action that depends on it is tested together.
      - name: Locate the branch build
        id: branch-bin
        if: runner.os == 'Linux'
        run: |
          ARCH=$(uname -m | sed 's/x86_64/amd64/; s/aarch64/arm64/')
          echo "path=$PWD/bin/vulnetix-linux-${ARCH}" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Test action
        if: runner.os == 'Linux'
        uses: ./
        with:
          org-id: '123e4567-e89b-12d3-a456-426614174000'
          binary-path: ${{ steps.branch-bin.outputs.path }}

      # The default the action installs is the newest release of the v4 channel;
      # the v3 channel stays frozen at its last release.
      - name: install.sh resolves a major channel
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/channel"
          for major in v4 v3; do
            VULNETIX_NO_ANALYTICS=1 sh install.sh --install-dir "$dir" --version "$major" | tee "$RUNNER_TEMP/channel-$major.log"
            grep -E "^info: channel $major resolved to $major\.[0-9]+\.[0-9]+\$" "$RUNNER_TEMP/channel-$major.log"
          done
        shell: bash

      - name: The action used the branch build and stored no credentials
        if: runner.os == 'Linux'
        env:
          WANT: ${{ steps.branch-bin.outputs.path }}
        run: |
          set -euo pipefail
          got=$(command -v vulnetix)
          cmp "$got" "$WANT"
          test ! -e .vulnetix/credentials.json
        shell: bash

  # Runs the unit tests and `analyze` from a git worktree rather than a clone.
  #
  # Developers (and coding agents) work in worktrees under `.claude/worktrees/<name>`, and a
  # worktree is not a clone: `.git` is a file, and the tree sits inside another checkout whose
  # walker also sees it. `analyze` derives evidence record ids from file paths, and the paths in
  # that layout collapsed to duplicate ids and aborted the run with a panic. The unit tests alone
  # never caught it because no test ran against a path like this.
  #
  # The script also writes two files whose paths differ only in punctuation, which is the
  # collision itself; without that fixture a clean worktree would pass even on the broken code.
  worktree:
    name: Test in a git worktree
    runs-on: [self-hosted, Linux, X64, vulnetix-local]
    needs: [lint]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Configure private fetch of vdb-sca-match and vdb-manifest (not yet in module proxy)
        run: |
          go env -w GOPRIVATE=github.com/Vulnetix/vdb-sca-match,github.com/Vulnetix/vdb-manifest
          git config --global url."https://x-access-token:${{ secrets.PACKAGES_TOKEN }}@github.com/Vulnetix/vdb-sca-match".insteadOf "https://github.com/Vulnetix/vdb-sca-match"
          git config --global url."https://x-access-token:${{ secrets.PACKAGES_TOKEN }}@github.com/Vulnetix/vdb-manifest".insteadOf "https://github.com/Vulnetix/vdb-manifest"

      - name: Build the CLI
        run: go build -o "$RUNNER_TEMP/vulnetix" .
        shell: bash
        env:
          CGO_ENABLED: "1"
          CGO_CFLAGS: "-w"

      - name: Analyze a worktree, from inside it and from the checkout that contains it
        run: bash scripts/ci-worktree-analyze.sh "$RUNNER_TEMP/vulnetix"
        shell: bash

      - name: Run the unit tests from a worktree
        run: |
          set -euo pipefail
          root="$PWD"
          wt="$root/.claude/worktrees/ci-test-$GITHUB_RUN_ID"
          mkdir -p "$root/.claude/worktrees"
          git worktree add --detach "$wt" HEAD
          # Clean up from the repository root: a trap that runs inside the worktree deletes the
          # directory it is standing in, the next git command dies with 128, and that exit code
          # replaces the real test result.
          trap 'cd "$root"; git worktree remove --force "$wt" || true; git worktree prune || true' EXIT
          cd "$wt"
          test -f .git   # a worktree's .git is a file; a directory means this is not testing one
          go test -timeout 30m ./...
        shell: bash
        env:
          CGO_ENABLED: "1"
          CGO_CFLAGS: "-w"

  # Proves the customer-facing signing path end to end, against public Fulcio
  # and public Rekor, using the identity this workflow already has.
  #
  # It is a real check rather than a unit test because the parts that break are
  # the ones no unit test reaches: whether the runner can actually mint an OIDC
  # token, whether Fulcio accepts it, and whether the signature cosign produces
  # a verification for is over the bytes that were written. The last one is the
  # subtle one, since the JSF signature is embedded in the document and changes
  # it after the SBOM is built.
  sign:
    name: Sign an SBOM as this runner
    runs-on: [self-hosted, Linux, X64, vulnetix-local]
    needs: [lint]
    permissions:
      # Without this the runner has no identity, --sign correctly declines to
      # sign, and the verification below would have nothing to check.
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Configure private fetch of vdb-sca-match and vdb-manifest (not yet in module proxy)
        run: |
          go env -w GOPRIVATE=github.com/Vulnetix/vdb-sca-match,github.com/Vulnetix/vdb-manifest
          git config --global url."https://x-access-token:${{ secrets.PACKAGES_TOKEN }}@github.com/Vulnetix/vdb-sca-match".insteadOf "https://github.com/Vulnetix/vdb-sca-match"
          git config --global url."https://x-access-token:${{ secrets.PACKAGES_TOKEN }}@github.com/Vulnetix/vdb-manifest".insteadOf "https://github.com/Vulnetix/vdb-manifest"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Build and sign an SBOM of this repository
        run: |
          set -euo pipefail
          go run . cdx --path . \
            --no-binary-analysis --no-aibom --no-cbom \
            --output-file signed.cdx.json \
            --sign
        shell: bash
        env:
          CGO_ENABLED: "1"
          CGO_CFLAGS: "-w"

      - name: Verify with stock cosign
        run: |
          set -euo pipefail

          # If --sign fell back to unsigned, these are missing and the job fails
          # here rather than passing on a document nobody signed.
          test -s signed.cdx.json.sig
          test -s signed.cdx.json.pem
          test -s signed.cdx.json.intoto.jsonl

          # No Vulnetix trust root anywhere in this command. A consumer runs
          # exactly this.
          cosign verify-blob \
            --signature signed.cdx.json.sig \
            --certificate signed.cdx.json.pem \
            --certificate-identity-regexp '^https://github.com/${{ github.repository }}/' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            signed.cdx.json
        shell: bash

  # install.sh and the setup action against a real release. The default
  # verify-provenance installs cosign and verifies the release's signed SLSA
  # provenance, and --require-provenance without cosign on PATH is refused.
  install-verify:
    name: Install a release with verified provenance
    runs-on: [self-hosted, Linux, X64, vulnetix-local]
    needs: [lint]
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup action, verify-provenance left at its default
        uses: ./setup

      - name: The installed CLI runs
        run: vulnetix version
        shell: bash

      - name: install.sh refuses --require-provenance without cosign
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/no-cosign"
          mkdir -p "$bin"
          for c in sh uname curl mkdir mktemp awk grep tr wc rm chmod mv head tail sed sort od date cat sha256sum; do
            ln -sf "$(command -v "$c")" "$bin/$c"
          done
          if PATH="$bin" VULNETIX_NO_ANALYTICS=1 sh install.sh --install-dir "$RUNNER_TEMP/refused" --require-provenance; then
            echo "::error::install.sh installed without cosign under --require-provenance"
            exit 1
          fi
          test ! -e "$RUNNER_TEMP/refused/vulnetix"
        shell: bash

  # The subdirectory actions and the root action, run as a consumer runs them
  # but against the binary this branch builds (binary-path), on a fixture with
  # a vulnerable package.json, a SAST pattern, a fake secret and a .vulnetix
  # folder that mixes config documents with SARIF and CycloneDX files.
  # Nothing is published: GitHub publishing is checked with --dry-run, and
  # real uploads happen only on main through vulnetix.yml.
  actions-e2e:
    name: Actions end to end
    runs-on: [self-hosted, Linux, X64, vulnetix-local]
    needs: [lint]
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Configure private fetch of vdb-sca-match and vdb-manifest (not yet in module proxy)
        run: |
          go env -w GOPRIVATE=github.com/Vulnetix/vdb-sca-match,github.com/Vulnetix/vdb-manifest
          git config --global url."https://x-access-token:${{ secrets.PACKAGES_TOKEN }}@github.com/Vulnetix/vdb-sca-match".insteadOf "https://github.com/Vulnetix/vdb-sca-match"
          git config --global url."https://x-access-token:${{ secrets.PACKAGES_TOKEN }}@github.com/Vulnetix/vdb-manifest".insteadOf "https://github.com/Vulnetix/vdb-manifest"

      - name: The generated actions are current
        run: go run ./tools/actiongen -root . -check
        shell: bash

      - name: actionlint and shellcheck
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/lint-bin"
          mkdir -p "$bin"
          curl -fsSL --retry 3 https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz | tar -xz -C "$bin" actionlint
          curl -fsSL --retry 3 https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.linux.x86_64.tar.xz | tar -xJ -C "$bin" --strip-components=1 shellcheck-v0.10.0/shellcheck
          "$bin/shellcheck" -x action-lib/*.sh
          # install.sh runs under sh but relies on local, which every sh it targets has.
          "$bin/shellcheck" -e SC3043 install.sh
          # This workflow uses every action the job runs, so actionlint checks
          # their inputs as well as its own scripts.
          "$bin/actionlint" -shellcheck "$bin/shellcheck" .github/workflows/test.yml
        shell: bash

      - name: Build the CLI
        run: go build -o "$RUNNER_TEMP/vulnetix" .
        shell: bash
        env:
          CGO_ENABLED: "1"
          CGO_CFLAGS: "-w"

      - name: Prepare the fixture
        id: fixture
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/action-fixture"
          rm -rf "$dir"
          cp -r testdata/action-fixture "$dir"
          mv "$dir/vulnetix-config" "$dir/.vulnetix"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "bin=$RUNNER_TEMP/vulnetix" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Root action, task sast
        id: root
        uses: ./
        with:
          binary-path: ${{ steps.fixture.outputs.bin }}
          task: sast
          path: ${{ steps.fixture.outputs.dir }}
          args: --no-banner --no-progress
          fail-on-findings: 'false'

      # github-code-scanning and dependency-graph make the action pass
      # --github-publish to the CLI; the dry run keeps the job from uploading
      # to this repository. A command that did not accept the flag fails here.
      - name: sca
        id: sca
        uses: ./sca
        with:
          binary-path: ${{ steps.fixture.outputs.bin }}
          path: ${{ steps.fixture.outputs.dir }}
          vex: |
            ${{ steps.fixture.outputs.dir }}/fixture.openvex.json
          github-code-scanning: 'true'
          dependency-graph: 'true'
          args: --no-banner --no-progress --github-publish-dry-run
          fail-on-findings: 'false'

      - name: sast
        id: sast
        uses: ./sast
        with:
          binary-path: ${{ steps.fixture.outputs.bin }}
          path: ${{ steps.fixture.outputs.dir }}
          args: --no-banner --no-progress
          fail-on-findings: 'false'

      - name: sbom
        id: sbom
        uses: ./sbom
        with:
          binary-path: ${{ steps.fixture.outputs.bin }}
          path: ${{ steps.fixture.outputs.dir }}
          args: --no-banner --no-progress --no-aibom --no-cbom
          fail-on-findings: 'false'

      # The fixture folder mixes documents with SARIF and CycloneDX files,
      # which the Platform IaC rule skips; ai-firewall.yaml is a well-known file.
      - name: config-plan, validating offline
        id: config
        uses: ./config-plan
        with:
          binary-path: ${{ steps.fixture.outputs.bin }}
          config-path: |
            ${{ steps.fixture.outputs.dir }}/.vulnetix/config
            ${{ steps.fixture.outputs.dir }}/.vulnetix/ai-firewall.yaml
          validate-only: 'true'

      - name: Check the outputs
        env:
          DIR: ${{ steps.fixture.outputs.dir }}
          BIN: ${{ steps.fixture.outputs.bin }}
          ROOT_FILES: ${{ steps.root.outputs.files }}
          SCA_FILES: ${{ steps.sca.outputs.files }}
          SCA_EXIT: ${{ steps.sca.outputs.exit-code }}
          SAST_SARIF: ${{ steps.sast.outputs.sarif }}
          SBOM: ${{ steps.sbom.outputs.sbom }}
          CONFIG_RESULT: ${{ steps.config.outputs.result }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          [ -n "$ROOT_FILES" ] || fail "the root action listed no files"
          [ -n "$SCA_FILES" ] || fail "sca listed no files"
          [ -n "$SCA_EXIT" ] || fail "sca reported no exit code"
          grep -q 'sca.sarif$' <<<"$SCA_FILES" || fail "sca did not write sca.sarif: $SCA_FILES"
          [ -f "$DIR/.vulnetix/code-scanning/sca.sarif" ] || fail "sca did not accept --github-publish (no code-scanning/sca.sarif)"
          sarif=$(head -n1 <<<"$SAST_SARIF")
          [ -f "$sarif" ] || fail "sast listed no SARIF"
          jq -e '.runs[0].automationDetails.id == "vulnetix/sast/"' "$sarif" >/dev/null || fail "no automationDetails"
          jq -e '[.runs[].results[].partialFingerprints.primaryLocationLineHash] | length > 0 and all(. != null)' "$sarif" >/dev/null || fail "no partialFingerprints"
          jq -e '[.runs[].tool.driver.rules[].properties["security-severity"] | select(. != null)] | length > 0' "$sarif" >/dev/null || fail "no security-severity"
          [ -f "$SBOM" ] || fail "sbom listed no SBOM"
          "$BIN" gha publish dependency-graph --dry-run --no-banner --path "$DIR" --sbom "$SBOM" > "$RUNNER_TEMP/snapshot.json"
          jq -e '.manifests | length > 0' "$RUNNER_TEMP/snapshot.json" >/dev/null || fail "the snapshot has no manifests"
          "$BIN" gha publish code-scanning --dry-run --no-banner --path "$DIR"
          ls "$DIR/.vulnetix/code-scanning/"*.sarif
          [ "$CONFIG_RESULT" = success ] || fail "config-plan validate: $CONFIG_RESULT"
          [ ! -e "$DIR/.vulnetix/credentials.json" ] || fail "a credentials file was written"
          [ ! -e .vulnetix/credentials.json ] || fail "a credentials file was written to the workspace"
        shell: bash
