# Signs SLSA v1 build provenance for a release's binaries, verifies the bundle,
# and uploads it to the GitHub release.
#
# This is a reusable workflow: it runs inside the CALLING repository's run, so
# `GITHUB_REPOSITORY`, `GITHUB_SHA` and `GITHUB_REF` name the caller, which is
# what the provenance has to say about. The signing identity is this file,
# though: the certificate Fulcio issues names `job_workflow_ref`, the called
# workflow. A consumer therefore checks for this workflow, not for whichever
# repository's release it signed.
#
# What the statement claims, and what it does not. Its subjects are the digests
# in the release's own checksums.txt (plus checksums.txt itself), so every
# binary a user can download is covered by one signed document. It is signed in
# a separate job from the build, by a workflow the build job cannot edit, with
# the run's OIDC identity. That is signed provenance of the build workflow, not
# an isolated builder: the build still runs on this organisation's runners, and
# the claim says so in `runner_environment`. Read it as SLSA Build L2, not L3.
#
# Same statement shape as the Pix sandbox image workflow in the website
# repository, with one difference: that repository is private, so it signs
# without a Rekor entry. Both callers of this workflow are public, so the
# default signing config is used and every bundle carries a public Rekor entry.
name: SLSA Provenance

on:
  workflow_call:
    # Input names use underscores, not hyphens: a hyphen reads as subtraction in an expression.
    inputs:
      subjects_artifact:
        description: 'name of an artifact in this run that holds the release checksums.txt'
        type: string
        required: true
      version:
        description: 'release tag the bundle is uploaded to (e.g. v1.2.3)'
        type: string
        required: true
      release_id:
        description: 'numeric id of that release, when the caller has it; otherwise it is looked up by tag over GraphQL'
        type: string
        required: false
        default: ''
    secrets:
      # The token that created the release (other callers keep GITHUB_TOKEN).
      # "release not found" from `gh release upload` was never about which
      # token could see the release: gh (since cli/cli#13723) reports a REST
      # rate-limit answer on its tag lookup as "release not found" whenever
      # the GraphQL draft lookup beside it finds no draft. The upload below
      # therefore never resolves the release by tag over REST, and it tells a
      # spent quota apart from a missing release.
      release_token:
        required: false

# No permissions: block, deliberately, a called workflow may not request a scope its caller does not hold.
# The caller's job must grant `id-token: write` (Sigstore signs with the OIDC
# identity) and `contents: write` (the upload to the release).
jobs:
  provenance:
    name: Sign and verify provenance
    runs-on: [self-hosted, Linux, X64, vulnetix-local]
    # Signing takes about a minute. The rest is room for the upload to wait
    # out a spent REST quota (up to an hour, see the upload step) rather than
    # fail the release.
    timeout-minutes: 80
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.subjects_artifact }}
          path: subjects

      - uses: sigstore/cosign-installer@v4.1.2

      - name: Build the statement
        id: statement
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test -s subjects/checksums.txt

          # The subject list is the release's checksums.txt, one entry per asset,
          # plus the file itself so the bundle can be verified against it.
          {
            cat subjects/checksums.txt
            printf '%s  checksums.txt\n' "$(sha256sum subjects/checksums.txt | cut -d' ' -f1)"
          } > subjects.txt

          # The builder id is this workflow at the ref the caller pinned. It is
          # read from the same OIDC claim Fulcio puts in the certificate, so the
          # statement and the signature cannot name different workflows.
          token="$(curl -fsSL -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sigstore" | jq -r .value)"
          payload="$(printf '%s' "$token" | cut -d. -f2 | tr '_-' '/+')"
          while [ $(( ${#payload} % 4 )) -ne 0 ]; do payload="${payload}="; done
          claims="$(printf '%s' "$payload" | base64 -d)"
          signer="$(jq -r .job_workflow_ref <<<"$claims")"
          # The commit of this workflow, for the upload script below.
          workflow_sha="$(jq -r '.job_workflow_sha // empty' <<<"$claims")"
          if ! [[ $workflow_sha =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::the OIDC token names no job_workflow_sha"; exit 1
          fi
          echo "workflow_sha=$workflow_sha" >> "$GITHUB_OUTPUT"
          case "$signer" in
            Vulnetix/cli/.github/workflows/slsa-provenance.yml@*) ;;
            *) echo "::error::unexpected signing workflow: $signer"; exit 1 ;;
          esac

          # GITHUB_WORKFLOW_REF is the caller's workflow: owner/repo/path@ref.
          caller="${GITHUB_WORKFLOW_REF%@*}"
          caller_path="${caller#"${GITHUB_REPOSITORY}/"}"

          jq -R -s \
            --arg repo "https://github.com/${GITHUB_REPOSITORY}" \
            --arg ref "$GITHUB_REF" --arg sha "$GITHUB_SHA" --arg path "$caller_path" \
            --arg event "$GITHUB_EVENT_NAME" --arg rid "$GITHUB_REPOSITORY_ID" --arg oid "$GITHUB_REPOSITORY_OWNER_ID" \
            --arg env "$RUNNER_ENVIRONMENT" --arg version "$VERSION" \
            --arg builder "https://github.com/${signer}" \
            --arg invocation "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}" \
            '{_type: "https://in-toto.io/Statement/v1",
              subject: (split("\n") | map(select(length > 0) | capture("^(?<h>[0-9a-f]{64})  (?<n>.+)$") | {name: .n, digest: {sha256: .h}})),
              predicateType: "https://slsa.dev/provenance/v1",
              predicate: {
                buildDefinition: {
                  buildType: "https://actions.github.io/buildtypes/workflow/v1",
                  externalParameters: {workflow: {ref: $ref, repository: $repo, path: $path}, release: $version},
                  internalParameters: {github: {event_name: $event, repository_id: $rid, repository_owner_id: $oid, runner_environment: $env}},
                  resolvedDependencies: [{uri: ("git+" + $repo + "@" + $ref), digest: {gitCommit: $sha}}]},
                runDetails: {builder: {id: $builder}, metadata: {invocationId: $invocation}}}}' subjects.txt > statement.json

          # A line that did not match the capture would be dropped silently by
          # the select, leaving a binary the document does not cover.
          want="$(grep -c . subjects.txt)"
          jq -e --argjson n "$want" '.subject | length == $n' statement.json >/dev/null
          echo "subjects: $want"

      - name: Sign
        run: cosign attest-blob --yes --statement statement.json --bundle candidate.sigstore.json subjects/checksums.txt

      # Only a bundle that verifies is named provenance.sigstore.json. The first
      # check is the signature, this workflow's identity, the transparency log
      # entry and checksums.txt as a subject. The second is the path a user
      # takes: a single binary named by digest, with no blob on disk.
      - name: Verify
        run: |
          set -euo pipefail
          identity='^https://github.com/Vulnetix/cli/\.github/workflows/slsa-provenance\.yml@'
          cosign verify-blob-attestation \
            --bundle candidate.sigstore.json --new-bundle-format \
            --type slsaprovenance1 \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "$identity" \
            subjects/checksums.txt

          # Every line of checksums.txt must be a subject of the signed statement.
          statement="$(jq -r '.dsseEnvelope.payload' candidate.sigstore.json | base64 -d)"
          while read -r digest name; do
            echo "$statement" | jq -e --arg d "$digest" --arg n "${name#\*}" \
              '.subject | any(.name == $n and .digest.sha256 == $d)' >/dev/null \
              || { echo "::error::$name is in checksums.txt but not in the statement"; exit 1; }
          done < subjects/checksums.txt

          first="$(head -n1 subjects/checksums.txt | cut -d' ' -f1)"
          cosign verify-blob-attestation \
            --bundle candidate.sigstore.json --new-bundle-format \
            --type slsaprovenance1 \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "$identity" \
            --digest "$first" --digestAlg sha256

          mv candidate.sigstore.json provenance.sigstore.json

      # The in-run hand-off goes first: it does not depend on the REST quota,
      # so a release upload that fails no longer takes the bundle with it.
      - uses: actions/upload-artifact@v7
        with:
          name: slsa-provenance
          path: provenance.sigstore.json
          # Only the caller's publish-tea job reads this, in this same run.
          retention-days: 1
          # A re-run of this job replaces the bundle an earlier attempt left.
          overwrite: true

      # The upload script, from this workflow's own commit (the OIDC claim the
      # statement step read), so a caller in another repository runs the code
      # this workflow is signed with.
      - uses: actions/checkout@v7
        with:
          repository: Vulnetix/cli
          ref: ${{ steps.statement.outputs.workflow_sha }}
          path: .slsa-provenance
          sparse-checkout: scripts/release-asset-upload.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # By release id, never by tag over REST: gh reports a spent REST quota on
      # its tag lookup as "release not found" (the script's header has why),
      # which failed v4.24.8, v4.24.32 and v4.24.34 until a re-run. A spent
      # quota now waits for its reset rather than failing the release.
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.release_token || github.token }}
          VERSION: ${{ inputs.version }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: bash .slsa-provenance/scripts/release-asset-upload.sh "$GITHUB_REPOSITORY" "$VERSION" "$RELEASE_ID" provenance.sigstore.json
