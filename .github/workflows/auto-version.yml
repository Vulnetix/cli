name: Auto Version

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

concurrency:
  group: auto-version
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  auto-version:
    runs-on: [self-hosted, Linux, X64, vulnetix-local]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "support@vulnetix.com"

      - name: Determine version bump
        id: bump
        run: |
          # Find the latest version tag
          LAST_TAG=$(git tag -l 'v*' --sort=-v:refname | head -n1)
          if [ -z "$LAST_TAG" ]; then
            LAST_TAG="v0.0.0"
            RANGE="HEAD"
          else
            RANGE="${LAST_TAG}..HEAD"
          fi

          echo "Last tag: $LAST_TAG"

          # Parse current version
          CURRENT="${LAST_TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          # Analyze commit messages for conventional commits. Commits marked
          # [skip ci] never count: the release workflow pushes
          # "chore: update flake.nix to vX [skip ci]" after every tag, and
          # counting it made the next unrelated push cut a patch release.
          BUMP=""
          while IFS= read -r msg; do
            if echo "$msg" | grep -qE '^[a-z]+(\(.+\))?!:|BREAKING CHANGE:'; then
              BUMP="major"
              break
            elif echo "$msg" | grep -qE '^feat(\(.+\))?:'; then
              if [ "$BUMP" != "major" ]; then
                BUMP="minor"
              fi
            elif echo "$msg" | grep -qE '^(fix|chore|perf|refactor|style|docs|test|build|ci)(\(.+\))?:'; then
              if [ -z "$BUMP" ]; then
                BUMP="patch"
              fi
            fi
          done < <(git log "$RANGE" --format="%s" 2>/dev/null | grep -vF '[skip ci]')

          if [ -z "$BUMP" ]; then
            echo "No conventional commits found since $LAST_TAG, skipping release."
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Calculate new version
          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          NEW_VERSION="v${MAJOR}.${MINOR}.${PATCH}"
          echo "Bump: $BUMP -> $NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "skip=false" >> $GITHUB_OUTPUT

      # The tag sits on a commit above main that names its own binary, so every
      # action ref resolves to one release. A lock file freezes the action
      # commit, and this file freezes what that commit installs. The commit
      # stays off main: it needs no bypass of the branch rules, cannot race
      # another push, and the tag keeps it reachable.
      - name: Stamp and tag the release
        if: steps.bump.outputs.skip != 'true'
        env:
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
        run: |
          printf '%s\n' "$NEW_VERSION" > action-lib/cli-release
          git add action-lib/cli-release
          git commit -m "chore: pin the actions to $NEW_VERSION [skip ci]"
          git tag -a "$NEW_VERSION" -m "Release $NEW_VERSION"
          git push origin "refs/tags/$NEW_VERSION"

      # Tags pushed by GITHUB_TOKEN don't trigger other workflows,
      # so we explicitly dispatch the release workflow
      - name: Trigger release workflow
        if: steps.bump.outputs.skip != 'true'
        run: |
          # At the tag, so the release builds the stamped commit and not whatever
          # main has become since the tag was cut.
          #
          # The tag is already pushed, so a failed dispatch leaves a version with
          # no release, and the next run tags past it. The job token shares the
          # repository's hourly installation quota with every scan on the push
          # to main, and a run of merges spends it: on 2026-11-13 every dispatch
          # after the first answered "API rate limit exceeded for installation".
          # So retry, then dispatch with the release token, which has its own
          # quota (and is the token release.yml publishes with anyway).
          dispatch() {
            GH_TOKEN="$1" gh workflow run release.yml \
              --ref "$VERSION" \
              --field version="$VERSION"
          }
          for attempt in 1 2 3; do
            if dispatch "$JOB_TOKEN"; then exit 0; fi
            echo "::warning::dispatch with the job token failed (attempt $attempt)"
            sleep $((attempt * 20))
          done
          if [ -n "$RELEASE_TOKEN" ] && dispatch "$RELEASE_TOKEN"; then
            echo "::notice::dispatched $VERSION with the release token"
            exit 0
          fi
          echo "::error::could not dispatch release.yml for $VERSION; run: gh workflow run release.yml --ref $VERSION --field version=$VERSION"
          exit 1
        env:
          VERSION: ${{ steps.bump.outputs.new_version }}
          JOB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
