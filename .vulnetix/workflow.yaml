version: 1
runner: vulnetix-local
rules:
  secrets:
    - Vulnetix/community-rules
    - Vulnetix/opa-fugue-regula
    - Vulnetix/opa-checkmarx-kics
    - Vulnetix/opa-cds-aws-tf
    - Vulnetix/opa-cigna-tf
    - Vulnetix/opa-aquasecurity-trivy
  sast:
    - Vulnetix/community-rules
    - Vulnetix/opa-fugue-regula
    - Vulnetix/opa-checkmarx-kics
    - Vulnetix/opa-cds-aws-tf
    - Vulnetix/opa-cigna-tf
    - Vulnetix/opa-aquasecurity-trivy
  iac:
    - Vulnetix/community-rules
    - Vulnetix/opa-fugue-regula
    - Vulnetix/opa-checkmarx-kics
    - Vulnetix/opa-cds-aws-tf
    - Vulnetix/opa-cigna-tf
    - Vulnetix/opa-aquasecurity-trivy
    - Vulnetix/opa-snyk-labs-iac
  containers:
    - Vulnetix/community-rules
    - Vulnetix/opa-fugue-regula
    - Vulnetix/opa-checkmarx-kics
    - Vulnetix/opa-cds-aws-tf
    - Vulnetix/opa-cigna-tf
    - Vulnetix/opa-aquasecurity-trivy
  "sast/go":
    - Vulnetix/opa-gosec
  "sast/python":
    - Vulnetix/opa-py-ruff
license: true
cbom: true
aibom: true
analyze: true
triggers: pr
publish: true
tea:
  visibility: public
sast: high
sca:
  - go
extras:
  - action: gha-settings
  - action: gha-org
  - action: gha-audit
  - action: gha-status
  - action: github-advisories
    prior:
      - sast
    with:
      dry-run: "true"
  - action: bom-validate
    prior:
      - sbom
    with:
      file: .vulnetix/sbom.cdx.json
  - action: license-policy-validate
    prior:
      - setup
    run:
      - "vulnetix license policy init --no-banner"
  - action: license-exceptions-check
    prior:
      - setup
    run:
      - "vulnetix license policy init --no-banner"
  - action: ai-firewall-apply
    with:
      file: testdata/action-fixture/vulnetix-config/ai-firewall.yaml
      dry-run: "true"
      baseline-required: "false"
  - action: image
    with:
      reference: "alpine:3.20"
      no-upload: "true"
      artifact-name: alpine-sbom
  - action: vex
    with:
      vex-command: "validate\ntestdata/action-fixture/fixture.openvex.json"
  - action: jail
  - action: upload
    prior:
      - sbom
    with:
      upload-file: .vulnetix/sbom.cdx.json
  - action: config-plan
    with:
      config-path: testdata/action-fixture/vulnetix-config/config
      validate-only: "true"
