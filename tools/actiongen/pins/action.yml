# The third-party actions the generated composites use, pinned by commit SHA.
# Nothing runs this file: it exists so Dependabot opens a pull request when one
# moves, and tools/actiongen reads the pins from here. The Actions pins job
# regenerates the composites on that pull request.
name: Vulnetix action pins
description: Pins read by tools/actiongen
runs:
  using: composite
  steps:
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
    - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
    - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
    - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
