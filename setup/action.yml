name: 'Vulnetix Setup'
description: 'Install the Vulnetix CLI and put it on PATH for later steps.'
author: 'Vulnetix'
branding:
  icon: 'shield'
  color: 'red'

inputs:
  version:
    description: 'Release of the Vulnetix CLI to install: an exact tag (v4.0.0), a major channel (v4, the newest v4 release) or latest'
    required: false
    default: 'v4'
  binary-path:
    description: 'Path to an already-built vulnetix binary to use instead of downloading a release'
    required: false

outputs:
  version:
    description: 'The installed CLI version'
    value: ${{ steps.install.outputs.version }}

runs:
  using: 'composite'
  steps:
    - name: Install the Vulnetix CLI
      id: install
      shell: bash
      env:
        VX_VERSION: ${{ inputs.version }}
        VX_BINARY_PATH: ${{ inputs.binary-path }}
      run: bash "$GITHUB_ACTION_PATH/../action-lib/install.sh"
