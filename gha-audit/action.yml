# Generated by tools/actiongen from tools/actiongen/spec.go. Do not edit;
# change the spec and run `go generate ./tools/actiongen`.
name: 'Vulnetix GHA audit'
description: 'Run every GitHub posture check: workflows, actions, settings and organisation (vulnetix gha audit).'
author: 'Vulnetix'
branding:
  icon: 'shield'
  color: 'red'

inputs:
  version:
    description: 'Release of the Vulnetix CLI to install. Empty installs the release this action ref was cut from, which is what a lock file or a SHA pin expects. An exact tag (v4.0.0), a major channel (v4) or latest float instead'
    required: false
  binary-path:
    description: 'Path to an already-built vulnetix binary to use instead of downloading a release'
    required: false
  verify-provenance:
    description: 'Verify the downloaded CLI against the signed SLSA provenance of its release with cosign, which this action installs: true or false. Every v4 release is signed; set false to install a v3 release that has no provenance.sigstore.json. The SHA-256 checksum is checked either way'
    required: false
    default: 'true'
  org-id:
    description: 'Vulnetix organization ID (UUID), used with api-key. Optional: without credentials the CLI runs in community mode'
    required: false
  api-key:
    description: 'Vulnetix API key. Passed to the CLI as VULNETIX_API_KEY, never on the command line'
    required: false
  api-token:
    description: 'Vulnetix API token; the server resolves the organization. Passed as VULNETIX_API_TOKEN'
    required: false
  args:
    description: 'Extra arguments for the command, separated by spaces or newlines (no shell quoting is applied)'
    required: false
  extra-args:
    description: 'Extra arguments, one per line, so a value may contain spaces'
    required: false
  artifact-name:
    description: 'Upload every file the command wrote as a workflow artifact with this name'
    required: false
  fail-on-findings:
    description: 'Fail the step when the command exits non-zero (findings over a gate, a breach, an error): true or false. The artifact, attestation and publish steps run either way'
    required: false
    default: 'true'
  github-code-scanning:
    description: 'Upload SARIF to GitHub code scanning (needs security-events: write): true or false'
    required: false
    default: 'false'
  github-token:
    description: 'Token for GitHub publishing, release assets and pull request comments'
    required: false
    default: ${{ github.token }}
  attest:
    description: 'Attest the written files with GitHub artifact attestations (needs id-token: write and attestations: write): true or false'
    required: false
    default: 'false'
  release-tag:
    description: 'Attach every file the command wrote to the GitHub release with this tag (needs contents: write)'
    required: false
  target:
    description: 'Directory holding the workflows'
    required: false
    default: '.'
  gha-fail-on:
    description: 'Exit 1 when a finding is at or above this severity: critical, high, medium or low (passed as --fail-on)'
    required: false
  min-severity:
    description: 'Drop findings below this severity'
    required: false
  offline:
    description: 'Do not call the GitHub API: analyse local files only. Rules that need the API report not evaluated: true or false'
    required: false
    default: 'false'
  upload:
    description: 'Publish the SARIF to Vulnetix as a snapshot (needs Vulnetix credentials): true or false'
    required: false
    default: 'false'
  repo:
    description: 'Repository as owner/name (default: this repository)'
    required: false
  rule:
    description: 'Only run these rule ids, one per line (passed as --rule)'
    required: false
  output-file:
    description: 'SARIF report path'
    required: false
    default: '.vulnetix/gha-audit.sarif'

outputs:
  files:
    description: 'Every file the command wrote, one per line'
    value: ${{ steps.run.outputs.files }}
  sarif:
    description: 'The SARIF files it wrote, one per line'
    value: ${{ steps.run.outputs.sarif }}
  sbom:
    description: 'The CycloneDX SBOM it wrote, if any'
    value: ${{ steps.run.outputs.sbom }}
  manifest:
    description: 'The artifact manifest (JSON Lines) listing what it wrote'
    value: ${{ steps.run.outputs.manifest }}
  exit-code:
    description: 'The command''s exit code'
    value: ${{ steps.run.outputs.exit-code }}
  result:
    description: 'success or failure'
    value: ${{ steps.run.outputs.result }}
  summary:
    description: 'One line saying what ran and how it ended'
    value: ${{ steps.run.outputs.summary }}

runs:
  using: 'composite'
  steps:
    - name: Install cosign
      if: inputs.verify-provenance == 'true' && inputs.binary-path == ''
      uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

    - name: Install the Vulnetix CLI
      id: install
      shell: bash
      env:
        VX_VERSION: ${{ inputs.version }}
        VX_BINARY_PATH: ${{ inputs.binary-path }}
        VX_VERIFY_PROVENANCE: ${{ inputs.verify-provenance }}
      run: bash "$GITHUB_ACTION_PATH/../action-lib/install.sh"

    - name: Run vulnetix gha audit --format sarif
      id: run
      shell: bash
      env:
        VX_ACTION: gha-audit
        VULNETIX_ORG_ID: ${{ inputs.org-id }}
        VULNETIX_API_KEY: ${{ inputs.api-key }}
        VULNETIX_API_TOKEN: ${{ inputs.api-token }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        VX_ARGS: ${{ inputs.args }}
        VX_EXTRA_ARGS: ${{ inputs.extra-args }}
        VX_IN_TARGET: ${{ inputs.target }}
        VX_IN_GHA_FAIL_ON: ${{ inputs.gha-fail-on }}
        VX_IN_MIN_SEVERITY: ${{ inputs.min-severity }}
        VX_IN_OFFLINE: ${{ inputs.offline }}
        VX_IN_UPLOAD: ${{ inputs.upload }}
        VX_IN_REPO: ${{ inputs.repo }}
        VX_IN_RULE: ${{ inputs.rule }}
        VX_IN_OUTPUT_FILE: ${{ inputs.output-file }}
      run: bash "$GITHUB_ACTION_PATH/../action-lib/run.sh"

    - name: Publish to GitHub
      if: ${{ !cancelled() && (inputs.github-code-scanning == 'true') }}
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        VX_MANIFEST: ${{ steps.run.outputs.manifest }}
        VX_CODE_SCANNING: ${{ inputs.github-code-scanning }}
      run: bash "$GITHUB_ACTION_PATH/../action-lib/publish.sh"

    - name: Upload the written files as an artifact
      if: ${{ !cancelled() && inputs.artifact-name != '' && steps.run.outputs.files != '' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.run.outputs.files }}
        if-no-files-found: warn
        include-hidden-files: true

    - name: Attest the written files
      if: ${{ !cancelled() && inputs.attest == 'true' && steps.run.outputs.files != '' }}
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: ${{ steps.run.outputs.files }}

    - name: Attach the written files to the release
      if: ${{ !cancelled() && inputs.release-tag != '' && steps.run.outputs.manifest != '' }}
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        VX_RELEASE_TAG: ${{ inputs.release-tag }}
        VX_MANIFEST: ${{ steps.run.outputs.manifest }}
      run: bash "$GITHUB_ACTION_PATH/../action-lib/release-assets.sh"

    - name: Finish
      if: ${{ !cancelled() }}
      shell: bash
      env:
        VX_EXIT_CODE: ${{ steps.run.outputs.exit-code }}
        VX_FAIL_ON_FINDINGS: ${{ inputs.fail-on-findings }}
        VX_SUMMARY: ${{ steps.run.outputs.summary }}
      run: bash "$GITHUB_ACTION_PATH/../action-lib/finish.sh"
