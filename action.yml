name: 'Vulnetix CLI Action'
description: 'GitHub Action that provides the Vulnetix CLI utility for vulnerability management'
author: 'Vulnetix'
branding:
  icon: 'shield'
  color: 'red'

inputs:
  org-id:
    description: 'Organization ID (UUID) for Vulnetix operations. Optional: without credentials the CLI runs in community mode. Passed to the CLI as VULNETIX_ORG_ID'
    required: false
    default: ''
  version:
    description: 'Release of the Vulnetix CLI to install: an exact tag (v4.0.0), a major channel (v4, the newest v4 release) or latest. The default is the major channel matching this action, so a workflow pinned to @v3 keeps a v3 binary and one pinned to @v4 gets v4'
    required: false
    default: 'v4'
  binary-path:
    description: 'Path to an already-built vulnetix binary to use instead of downloading a release, for example one built earlier in the same job'
    required: false
    default: ''
  task:
    description: 'Task to perform: info, upload, gha (gha-upload), tea-release, config-plan, config-apply, or any subdirectory action: sca, sast, secrets, iac, containers, license, malscan, analyze, cbom, aibom, sbom, jail. The subdirectory actions (Vulnetix/cli/sca@v3) offer the artifact, attestation and release steps as well'
    required: false
    default: 'info'
  api-key:
    description: 'Direct API Key for Vulnetix authentication (hex digest), used with org-id. Passed to the CLI as VULNETIX_API_KEY, never on the command line'
    required: false
  api-token:
    description: 'Vulnetix API token; the server resolves the organization. Passed to the CLI as VULNETIX_API_TOKEN, never on the command line'
    required: false
  vex:
    description: 'VEX documents to apply before the gates (scan tasks: sca, sast, secrets, iac, containers), one path, directory or https URL per line, passed as --vex. VexSource documents under .vulnetix/config apply too'
    required: false
  upload-file:
    description: 'Path to artifact file to upload (used with task: upload)'
    required: false
  upload-format:
    description: 'Override auto-detected artifact format (cyclonedx, spdx, sarif, openvex, csaf_vex)'
    required: false
  tea-files:
    description: 'Files to publish, one path or glob per line (used with task: tea-release)'
    required: false
  tea-product:
    description: 'TEA product name; defaults to the GitHub repository (used with task: tea-release)'
    required: false
  tea-purl:
    description: 'Package URL identifying the TEA product; defaults to pkg:github/<tea-product> (used with task: tea-release)'
    required: false
  tea-version:
    description: 'TEA release version; defaults to the tag on a tag run (used with task: tea-release)'
    required: false
  tea-date:
    description: 'TEA release date (RFC3339). Set it for a version that is not a git tag, so that re-running the job republishes the same release (used with task: tea-release)'
    required: false
  tea-pre-release:
    description: 'Mark the TEA release as a pre-release: true or false (used with task: tea-release)'
    required: false
    default: 'false'
  tea-visibility:
    description: 'Visibility once published: private, shared or public. Public cannot be undone (used with task: tea-release)'
    required: false
  tea-dry-run:
    description: 'Print what would be published and exit: true or false (used with task: tea-release)'
    required: false
    default: 'false'
  config-token:
    description: 'Config management token (vmt_...) for config-plan and config-apply. Passed to the CLI as VULNETIX_CONFIG_TOKEN, never on the command line'
    required: false
  config-path:
    description: 'Config documents to plan or apply, one file or directory per line (default: .vulnetix/config)'
    required: false
  config-manager:
    description: 'Manager the documents are declared by (default: gitops:<owner/repo> of this repository)'
    required: false
  config-prune:
    description: 'Delete objects this manager owns that the documents no longer declare: true or false'
    required: false
    default: 'false'
  github-token:
    description: 'Token for GitHub publishing and for commenting the config plan on a pull request (task: config-plan, needs pull-requests: write)'
    required: false
    default: ${{ github.token }}
  path:
    description: 'Directory to scan, for the scanning tasks'
    required: false
    default: '.'
  args:
    description: 'Extra arguments for the command, separated by spaces or newlines (no shell quoting is applied)'
    required: false
  fail-on-findings:
    description: 'Fail the step when the command exits non-zero: true or false'
    required: false
    default: 'true'
  github-code-scanning:
    description: 'Upload SARIF to GitHub code scanning (needs security-events: write): true or false'
    required: false
    default: 'false'
  dependency-graph:
    description: 'Submit the SBOM to the GitHub dependency graph (needs contents: write): true or false'
    required: false
    default: 'false'
  validate-only:
    description: 'task: config-plan only. Validate the documents offline instead of planning: true or false'
    required: false
    default: 'false'
outputs:
  result:
    description: 'Result of the Vulnetix CLI execution'
    value: ${{ steps.vulnetix-run.outputs.result }}
  summary:
    description: 'Summary of what ran'
    value: ${{ steps.vulnetix-run.outputs.summary }}
  upload-uuid:
    description: 'Pipeline UUID of the uploaded artifact (when task is upload)'
    value: ${{ steps.vulnetix-run.outputs.upload-uuid }}
  files:
    description: 'Every file the command wrote, one per line'
    value: ${{ steps.vulnetix-run.outputs.files }}
  sarif:
    description: 'The SARIF files it wrote, one per line'
    value: ${{ steps.vulnetix-run.outputs.sarif }}
  sbom:
    description: 'The CycloneDX SBOM it wrote, if any'
    value: ${{ steps.vulnetix-run.outputs.sbom }}
  manifest:
    description: 'The artifact manifest (JSON Lines) listing what it wrote'
    value: ${{ steps.vulnetix-run.outputs.manifest }}
  exit-code:
    description: 'The command''s exit code'
    value: ${{ steps.vulnetix-run.outputs.exit-code }}

runs:
  using: 'composite'
  steps:
    # The installer shipped at this action's ref, so the major channel logic
    # matches the ref the workflow pinned. binary-path skips the download.
    - name: Setup Vulnetix CLI
      shell: bash
      env:
        VX_VERSION: ${{ inputs.version }}
        VX_BINARY_PATH: ${{ inputs.binary-path }}
      run: bash "$GITHUB_ACTION_PATH/action-lib/install.sh"

    # Credentials reach the CLI only as environment variables, which it reads
    # before any stored file (pkg/auth/credentials.go). Nothing is written to
    # .vulnetix/credentials.json, so no credential can end up in an artifact a
    # later step uploads, and none appears on a command line.
    - name: Verify Vulnetix Authentication
      if: inputs.api-key != '' || inputs.api-token != ''
      shell: bash
      env:
        VULNETIX_ORG_ID: ${{ inputs.org-id }}
        VULNETIX_API_KEY: ${{ inputs.api-key }}
        VULNETIX_API_TOKEN: ${{ inputs.api-token }}
      run: vulnetix auth verify

    # The same runner the subdirectory actions use (action-lib/run.sh). Every
    # input arrives as an environment variable; the command is an argv array,
    # never eval, and no expression is interpolated into a script.
    - name: Run Vulnetix CLI
      id: vulnetix-run
      shell: bash
      env:
        VX_ACTION: ${{ inputs.task }}
        VULNETIX_ORG_ID: ${{ inputs.org-id }}
        VULNETIX_API_KEY: ${{ inputs.api-key }}
        VULNETIX_API_TOKEN: ${{ inputs.api-token }}
        VULNETIX_CONFIG_TOKEN: ${{ inputs.config-token }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        VX_EVENT_NAME: ${{ github.event_name }}
        VX_PATH: ${{ inputs.path }}
        VX_ARGS: ${{ inputs.args }}
        VX_CODE_SCANNING: ${{ inputs.github-code-scanning }}
        VX_DEPENDENCY_GRAPH: ${{ inputs.dependency-graph }}
        VX_IN_VEX: ${{ inputs.vex }}
        VX_IN_UPLOAD_FILE: ${{ inputs.upload-file }}
        VX_IN_UPLOAD_FORMAT: ${{ inputs.upload-format }}
        VX_IN_TEA_FILES: ${{ inputs.tea-files }}
        VX_IN_TEA_PRODUCT: ${{ inputs.tea-product }}
        VX_IN_TEA_PURL: ${{ inputs.tea-purl }}
        VX_IN_TEA_VERSION: ${{ inputs.tea-version }}
        VX_IN_TEA_DATE: ${{ inputs.tea-date }}
        VX_IN_TEA_PRE_RELEASE: ${{ inputs.tea-pre-release }}
        VX_IN_TEA_VISIBILITY: ${{ inputs.tea-visibility }}
        VX_IN_TEA_DRY_RUN: ${{ inputs.tea-dry-run }}
        VX_IN_CONFIG_PATH: ${{ inputs.config-path }}
        VX_IN_CONFIG_MANAGER: ${{ inputs.config-manager }}
        VX_IN_CONFIG_PRUNE: ${{ inputs.config-prune }}
        VX_IN_VALIDATE_ONLY: ${{ inputs.validate-only }}
      run: bash "$GITHUB_ACTION_PATH/action-lib/run.sh"

    # license writes SARIF but does not publish it itself.
    - name: Publish to GitHub
      if: ${{ !cancelled() && inputs.task == 'license' && inputs.github-code-scanning == 'true' }}
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        VX_PATH: ${{ inputs.path }}
        VX_MANIFEST: ${{ steps.vulnetix-run.outputs.manifest }}
        VX_CODE_SCANNING: ${{ inputs.github-code-scanning }}
      run: bash "$GITHUB_ACTION_PATH/action-lib/publish.sh"

    - name: Finish
      if: ${{ !cancelled() }}
      shell: bash
      env:
        VX_EXIT_CODE: ${{ steps.vulnetix-run.outputs.exit-code }}
        VX_FAIL_ON_FINDINGS: ${{ inputs.fail-on-findings }}
        VX_SUMMARY: ${{ steps.vulnetix-run.outputs.summary }}
      run: bash "$GITHUB_ACTION_PATH/action-lib/finish.sh"
