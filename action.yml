name: 'Vulnetix CLI Action'
description: 'GitHub Action that provides the Vulnetix CLI utility for vulnerability management'
author: 'Vulnetix'
branding:
  icon: 'shield'
  color: 'red'

inputs:
  org-id:
    description: 'Organization ID (UUID) for Vulnetix operations'
    required: true
  version:
    description: 'Release of the Vulnetix CLI to install, for example v3.111.0 (default: latest)'
    required: false
    default: 'latest'
  task:
    description: 'Task to perform: info, upload, gha, tea-release'
    required: false
    default: 'info'
  api-key:
    description: 'Direct API Key for Vulnetix authentication (hex digest)'
    required: false
  upload-file:
    description: 'Path to artifact file to upload (used with task: upload)'
    required: false
  upload-format:
    description: 'Override auto-detected artifact format (cyclonedx, spdx, sarif, openvex, csaf_vex)'
    required: false
  tea-files:
    description: 'Files to publish, one path or glob per line (used with task: tea-release)'
    required: false
  tea-product:
    description: 'TEA product name; defaults to the GitHub repository (used with task: tea-release)'
    required: false
  tea-purl:
    description: 'Package URL identifying the TEA product; defaults to pkg:github/<tea-product> (used with task: tea-release)'
    required: false
  tea-version:
    description: 'TEA release version; defaults to the tag on a tag run (used with task: tea-release)'
    required: false
  tea-date:
    description: 'TEA release date (RFC3339). Set it for a version that is not a git tag, so that re-running the job republishes the same release (used with task: tea-release)'
    required: false
  tea-pre-release:
    description: 'Mark the TEA release as a pre-release: true or false (used with task: tea-release)'
    required: false
    default: 'false'
  tea-visibility:
    description: 'Visibility once published: private, shared or public. Public cannot be undone (used with task: tea-release)'
    required: false
  tea-dry-run:
    description: 'Print what would be published and exit: true or false (used with task: tea-release)'
    required: false
    default: 'false'
outputs:
  result:
    description: 'Result of the Vulnetix CLI execution'
    value: ${{ steps.vulnetix-run.outputs.result }}
  summary:
    description: 'Summary of vulnerabilities processed'
    value: ${{ steps.vulnetix-run.outputs.summary }}
  upload-uuid:
    description: 'Pipeline UUID of the uploaded artifact (when task is upload)'
    value: ${{ steps.vulnetix-run.outputs.upload-uuid }}

runs:
  using: 'composite'
  steps:
    - name: Setup Vulnetix CLI
      shell: bash
      # The released binary, not a build from source: building needs private Go
      # modules (vdb-sca-match), which a runner in another repository cannot read.
      # Every reusable workflow in the fleet installs the same way.
      env:
        VX_VERSION: ${{ inputs.version }}
      run: |
        echo "Setting up Vulnetix CLI..."

        mkdir -p "$HOME/bin"
        args=(--install-dir "$HOME/bin")

        # install.sh takes a release tag, which starts with v; accept 3.59.4 as well.
        if [ -n "$VX_VERSION" ] && [ "$VX_VERSION" != "latest" ]; then
          case "$VX_VERSION" in
            v*) args+=(--version "$VX_VERSION") ;;
            *) args+=(--version "v$VX_VERSION") ;;
          esac
        fi

        # Downloaded to a file with retries, so a transient 5xx from
        # cli.vulnetix.com is retried instead of failing the caller's job.
        curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 \
          -o "$RUNNER_TEMP/vulnetix-install.sh" https://cli.vulnetix.com/install.sh
        sh "$RUNNER_TEMP/vulnetix-install.sh" "${args[@]}"

        echo "$HOME/bin" >> "$GITHUB_PATH"

        "$HOME/bin/vulnetix" version

    - name: Authenticate with Vulnetix
      if: inputs.api-key != ''
      shell: bash
      run: |
        vulnetix auth login \
          --api-key '${{ inputs.api-key }}' \
          --org-id '${{ inputs.org-id }}' \
          --store project

    - name: Verify Vulnetix Authentication
      if: inputs.api-key != ''
      shell: bash
      run: |
        vulnetix auth verify

    - name: Run Vulnetix CLI
      id: vulnetix-run
      shell: bash
      # Read by the tea-release task below. They arrive as environment variables
      # rather than being interpolated into the script, so a value containing a
      # quote or a command substitution stays data.
      env:
        VX_TASK: ${{ inputs.task }}
        VX_TEA_FILES: ${{ inputs.tea-files }}
        VX_TEA_PRODUCT: ${{ inputs.tea-product }}
        VX_TEA_PURL: ${{ inputs.tea-purl }}
        VX_TEA_VERSION: ${{ inputs.tea-version }}
        VX_TEA_DATE: ${{ inputs.tea-date }}
        VX_TEA_PRE_RELEASE: ${{ inputs.tea-pre-release }}
        VX_TEA_VISIBILITY: ${{ inputs.tea-visibility }}
        VX_TEA_DRY_RUN: ${{ inputs.tea-dry-run }}
      run: |
        echo "Running Vulnetix CLI with org-id: ${{ inputs.org-id }}"

        # Handle tea-release task - publish a product, release, collection and artifacts to TEA
        if [ "$VX_TASK" = "tea-release" ]; then
          args=(tea release)

          # One path or glob per line; the CLI expands globs itself.
          while IFS= read -r f; do
            f="${f#"${f%%[![:space:]]*}"}"
            f="${f%"${f##*[![:space:]]}"}"
            [ -n "$f" ] && args+=("$f")
          done <<< "$VX_TEA_FILES"

          [ -n "$VX_TEA_PRODUCT" ] && args+=(--product "$VX_TEA_PRODUCT")
          [ -n "$VX_TEA_PURL" ] && args+=(--purl "$VX_TEA_PURL")
          [ -n "$VX_TEA_VERSION" ] && args+=(--version "$VX_TEA_VERSION")
          [ -n "$VX_TEA_DATE" ] && args+=(--date "$VX_TEA_DATE")
          [ -n "$VX_TEA_VISIBILITY" ] && args+=(--visibility "$VX_TEA_VISIBILITY")
          [ "$VX_TEA_PRE_RELEASE" = "true" ] && args+=(--pre-release)
          [ "$VX_TEA_DRY_RUN" = "true" ] && args+=(--dry-run)

          vulnetix "${args[@]}"
          echo "result=success" >> $GITHUB_OUTPUT
          if [ "$VX_TEA_DRY_RUN" = "true" ]; then
            echo "summary=TEA release dry run completed; nothing was published" >> $GITHUB_OUTPUT
          else
            echo "summary=TEA release published successfully" >> $GITHUB_OUTPUT
          fi
          exit 0
        fi

        # Handle gha task - upload all workflow artifacts via GitHub API
        if [ "${{ inputs.task }}" = "gha" ]; then
          vulnetix gha upload --org-id '${{ inputs.org-id }}' --json
          echo "result=success" >> $GITHUB_OUTPUT
          echo "summary=GitHub Actions artifacts uploaded successfully" >> $GITHUB_OUTPUT
          exit 0
        fi

        # Handle upload task - upload a single file directly
        if [ "${{ inputs.task }}" = "upload" ]; then
          UPLOAD_ARGS="upload --file '${{ inputs.upload-file }}' --org-id '${{ inputs.org-id }}' --json"

          if [ -n "${{ inputs.upload-format }}" ]; then
            UPLOAD_ARGS="$UPLOAD_ARGS --format '${{ inputs.upload-format }}'"
          fi

          RESULT=$(eval "vulnetix $UPLOAD_ARGS")
          echo "$RESULT"

          # Extract pipeline ID for output
          PIPELINE_ID=$(echo "$RESULT" | jq -r '.pipelineRecord.uuid // empty' 2>/dev/null || true)
          if [ -n "$PIPELINE_ID" ]; then
            echo "upload-uuid=$PIPELINE_ID" >> $GITHUB_OUTPUT
          fi

          echo "result=success" >> $GITHUB_OUTPUT
          echo "summary=Artifact uploaded successfully" >> $GITHUB_OUTPUT
          exit 0
        fi

        # Default task: run info healthcheck
        vulnetix

        # Set outputs (these would be set by the actual CLI)
        echo "result=success" >> $GITHUB_OUTPUT
        echo "summary=Vulnerability analysis completed" >> $GITHUB_OUTPUT
